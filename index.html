<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#231F20">
<title>Skill Tally</title>
<style>
:root{
  /* Mangakahia Rugby crest colours: royal blue #004AAD, navy #113277, black #231F20, white, cow yellow #FCE129, green #00955E */
  --bg:#231F20; --surface:#10286A; --surface2:#113A8C; --line:#1F5DC7;
  --text:#FFFFFF; --muted:#B5C5EC; --solo:#FCE129; --tabon:#FCE129; --heat:#FCE129; --hi:#231F20; --hi2:#231F20;
  --left:#7CC4FF; --right:#FCE129; --c2:#5EE3B0; --c3:#D3B4FA; --c4:#FF9EC0; --c5:#FFA24D;
  --good:#3FD696; --danger:#FF7B7B; --on-accent:#231F20;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F1F5FC; --surface:#FFFFFF; --surface2:#E1E9F8; --line:#B4C5E8;
    --text:#231F20; --muted:#55628A; --solo:#004AAD; --tabon:#004AAD; --heat:#004AAD; --hi:#231F20; --hi2:#FFFFFF;
    --left:#0E7AC4; --right:#B37A00; --c2:#00805A; --c3:#7A4FC0; --c4:#C0356F; --c5:#C4600A;
    --good:#00805A; --danger:#C0392B; --on-accent:#FFFFFF; color-scheme:light;
  }
}
:root[data-theme="dark"]{ color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;min-height:100vh;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;padding:0;}
button:disabled{opacity:.35;cursor:default;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--tabon);outline-offset:2px;}
#app{max-width:560px;margin:0 auto;padding:14px 16px 110px;}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.01em;}
h2{font-size:18px;margin:24px 0 8px;}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.brand img{width:68px;height:auto;border-radius:12px;flex:none;}
.brand h1{margin:0;}
.brand .sub{margin:2px 0 0;}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.top h1{flex:1;margin:0;font-size:21px;}
.icon{min-width:44px;height:44px;border-radius:12px;background:var(--surface);font-size:20px;display:grid;place-items:center;padding:0 12px;}
.btn{min-height:48px;padding:0 18px;border-radius:12px;background:var(--surface2);font-weight:700;}
.btn.primary{background:var(--solo);color:var(--on-accent);}
.btn.danger{color:var(--danger);}
.btn.wide{width:100%;}
.row{display:flex;gap:10px;flex-wrap:wrap;}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#231F20;border-top:2px solid #004AAD;
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;}
#tabs .in{display:flex;width:100%;max-width:560px;}
#tabs button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#A9B4CE;font-size:12px;font-weight:700;}
#tabs button[aria-current="page"]{color:#FCE129;}
#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* cards */
.card{display:block;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line);}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;}
.card .name{font-size:19px;font-weight:800;}
.card .sport{font-size:13px;color:var(--muted);}
.mini{margin-top:10px;}
.mini .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px;}
.mini .lbl b{font-variant-numeric:tabular-nums;}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--c,var(--tabon));border-radius:6px;transition:width .25s;}

/* counter */
.side{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;margin-bottom:12px;}
.tap{width:100%;display:block;text-align:left;border-radius:14px;padding:14px 16px 16px;background:var(--surface2);border-left:8px solid var(--c);}
.tap:active{transform:scale(.985);filter:brightness(1.15);}
.tap .lab{font-size:17px;font-weight:800;color:var(--c);}
.tap .count{font-size:clamp(52px,19vw,88px);font-weight:900;line-height:1.02;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.tap .of{font-size:14px;color:var(--muted);margin-bottom:10px;}
.chips{display:flex;gap:8px;margin-top:10px;}
.chips button{flex:1;min-height:48px;border-radius:12px;background:var(--surface2);font-weight:800;font-size:17px;}
.chips button:active{filter:brightness(1.25);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;}
.stat span{font-size:12px;color:var(--muted);}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--solo);color:var(--on-accent);font-weight:800;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:9;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* forms */
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px;}
input[type=text],input[type=number],input[type=date],textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);user-select:text;-webkit-user-select:text;}
textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:12px;}
.pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;}
.pill[aria-pressed="true"]{background:var(--solo);color:var(--on-accent);border-color:var(--solo);}
.note{font-size:13px;color:var(--muted);margin:8px 0;}
.empty{text-align:center;padding:30px 10px;color:var(--muted);}
.orow{display:grid;grid-template-columns:1fr 112px 44px;gap:8px;margin-bottom:8px;align-items:center;}
.orow.m{grid-template-columns:1fr 100px 44px;}
.hdrs{display:grid;grid-template-columns:1fr 112px 44px;gap:8px;font-size:12px;color:var(--muted);margin-top:14px;}

/* calendar */
.month{display:flex;align-items:center;gap:8px;margin:8px 0 10px;}
.month h2{flex:1;margin:0;text-align:center;font-size:19px;}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.dow span{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding-bottom:2px;}
.cell{position:relative;aspect-ratio:1/1.08;border-radius:10px;background:var(--surface);border:1px solid var(--line);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:0;}
.cell .heat{position:absolute;inset:0;background:var(--heat);opacity:var(--h,0);}
.cell .d{position:relative;font-weight:800;font-size:15px;line-height:1.1;}
.cell .n{position:relative;font-size:10px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--muted);min-height:11px;}
.cell.hi .d,.cell.hi .n{color:var(--hi);}
.cell.hi2 .d,.cell.hi2 .n{color:var(--hi2);}
.cell.today{outline:2px solid var(--tabon);outline-offset:-2px;}
.cell.blank{visibility:hidden;}
.cell:active{filter:brightness(1.2);}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:10px 0;}
.legend i{width:16px;height:12px;border-radius:3px;background:var(--heat);display:inline-block;}

/* day view */
.daynav{display:flex;gap:8px;margin-bottom:12px;}
.daynav .btn{flex:1;padding:0 8px;}
.dtotal{font-size:14px;color:var(--muted);margin:0 0 12px;}
.drow{margin-top:12px;}
.drow .dl{font-weight:800;color:var(--c);margin-bottom:6px;}
.dctl{display:grid;grid-template-columns:48px 48px minmax(0,1fr) 48px 48px;gap:6px;}
.dctl button{min-height:48px;border-radius:12px;background:var(--surface2);font-weight:800;}
.dctl button:active{filter:brightness(1.25);}
.dctl input{text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 4px;}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 10px;margin-top:10px;}
.bars{display:flex;align-items:stretch;gap:2px;height:150px;border-bottom:1px solid var(--line);}
.bars.w{gap:8px;}
.col{flex:1;min-width:0;height:100%;}
.col .stack{display:flex;flex-direction:column-reverse;height:100%;}
.col .seg{display:block;width:100%;}
.col:first-child .seg:last-child{border-radius:3px 3px 0 0;}
.col:active{filter:brightness(1.3);}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-top:8px;}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
.kv b{display:block;font-size:19px;font-variant-numeric:tabular-nums;}
.kv span{font-size:12px;color:var(--muted);}
.eta{font-size:14px;margin-top:10px;}
.eta div{margin-top:4px;}
.eta span{color:var(--muted);}
.tbars{display:flex;align-items:stretch;gap:6px;height:150px;border-bottom:1px solid var(--line);}
.tbars .grp{flex:1;min-width:0;display:flex;align-items:flex-end;gap:1px;height:100%;}
.tbars .tb{flex:1;min-width:0;border-radius:2px 2px 0 0;}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px;}
.linkbtn{color:var(--muted);font-size:13px;font-weight:700;min-height:44px;padding:0 4px;text-decoration:underline;}
.steps{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:14px;}
.steps li{margin-bottom:6px;}

/* fitness: sessions and time entry */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tgrid div{display:flex;align-items:center;gap:6px;min-width:0;}
.tgrid input{text-align:center;padding:10px 4px;min-width:0;}
.tgrid span{font-size:13px;color:var(--muted);}
.sform label:first-child{margin-top:4px;}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.srow:first-of-type{border-top:0;}
.tiles.sm .stat b{font-size:17px;}
.tiles+.tiles{margin-top:8px;}
.card .tiles{margin-top:10px;}

/* badges */
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;opacity:.78;}
.badge.on{opacity:1;border-color:var(--tabon);}
.badge .bi{font-size:34px;line-height:1.15;filter:grayscale(1);}
.badge.on .bi{filter:none;}
.badge .bt{font-weight:800;font-size:14px;margin-top:4px;}
.badge .bd,.badge .bp{font-size:12px;color:var(--muted);margin-top:2px;}
.badge .bp{font-weight:700;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" aria-label="Main">
  <div class="in">
    <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Activities</button>
    <button data-act="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>Calendar</button>
    <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Stats</button>
    <button data-act="tab" data-tab="team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.9.3 5 2.7 5 5.8"/></svg>Team</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var KEY="skilltally-v1";

/* ---------- presets: each activity has its own options and goal ---------- */
var FEET=[{l:"Left foot"},{l:"Right foot"}];
var HANDS=[{l:"Left hand"},{l:"Right hand"}];
var MM=[{l:"Made"},{l:"Missed",t:false}];
function one(l){return [{l:l}];}
function pr(n,sides,o){
  o=o||{};
  return {n:n,sides:sides,kind:o.kind||"count",unit:o.unit||"km",pace:o.pace||"perkm",period:o.period||"total",target:o.target===undefined?10000:o.target};
}
function cardio(n,unit,pace,target){return pr(n,[{l:"Distance"}],{kind:"cardio",unit:unit,pace:pace,period:"month",target:target});}
var SPORTS={
  "Rugby":[pr("Pass",[{l:"Left"},{l:"Right"}]),pr("Drop kick",FEET),pr("Box kick",FEET),pr("Goal kick",MM),pr("Grubber",FEET),pr("Line-out throw",one("Throws")),pr("Tackle",[{l:"Left shoulder"},{l:"Right shoulder"}])],
  "Fitness":[cardio("Run","km","perkm",100),cardio("Walk","km","perkm",100),cardio("Swim","m","per100m",5000),cardio("Cycle","km","kmh",200),
    pr("Push-ups",one("Push-ups"),{period:"day",target:50}),pr("Sit-ups",one("Sit-ups"),{period:"day",target:50}),
    pr("Pull-ups",one("Pull-ups"),{period:"day",target:10}),pr("Squats",one("Squats"),{period:"day",target:50})],
  "Football":[pr("Pass",FEET),pr("Shot",FEET),pr("Dribble",FEET),pr("Juggle",one("Juggles"))],
  "Basketball":[pr("Free throw",MM),pr("Layup",HANDS),pr("Three-pointer",MM)],
  "Cricket":[pr("Bowl",one("Balls")),pr("Catch",[{l:"Caught"},{l:"Dropped",t:false}]),pr("Bat drill",one("Shots"))],
  "Netball":[pr("Pass",HANDS),pr("Shot",MM)],
  "Hockey":[pr("Push pass",[{l:"Forehand"},{l:"Backhand"}]),pr("Shot",[{l:"Forehand"},{l:"Backhand"}])],
  "Other":[]
};
var PERIODS=[["total","Total"],["day","Per day"],["week","Per week"],["month","Per month"]];
var PERIOD_IDS=["total","day","week","month"];
var PACES=[["perkm","Min per km"],["per100m","Min per 100 m"],["kmh","Speed (km/h)"]];
var PACE_IDS=["perkm","per100m","kmh"];
var PALETTE=["var(--left)","var(--right)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
var MAX_OPTS=6;

/* ---------- dates ---------- */
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return keyOf(new Date());}
function ymd(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);}
function longDay(k){return parseKey(k).toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short",year:"numeric"});}
function shortDay(k){return parseKey(k).toLocaleDateString("en-NZ",{day:"numeric",month:"short"});}
function midDay(k){return parseKey(k).toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short"});}
function validDate(k){return /^\d{4}-\d{2}-\d{2}$/.test(String(k||""));}

/* ---------- helpers ---------- */
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(n){return Number(n).toLocaleString("en-NZ",{maximumFractionDigits:2});}
function fmtShort(n){
  n=Number(n)||0;
  if(n>=10000) return Math.round(n/1000)+"k";
  if(n>=1000) return (n/1000).toFixed(1).replace(".0","")+"k";
  if(n>=100) return String(Math.round(n));
  return String(Math.round(n*10)/10);
}
function pct(a,b){return b>0?Math.min(100,a/b*100):0;}
function round3(x){return Math.round(x*1000)/1000;}
function num(v){v=String(v||"").replace(",",".");var n=parseFloat(v);return isFinite(n)&&n>0?n:0;}

function seed(){
  return {skills:[{id:uid(),sport:"Rugby",name:"Pass",kind:"count",period:"total",
    sides:[{id:"a",label:"Left",target:10000},{id:"b",label:"Right",target:10000}],log:{}}]};
}
function load(){
  try{var raw=localStorage.getItem(KEY); if(raw){var d=JSON.parse(raw); if(d&&Array.isArray(d.skills)) return d;}}catch(e){}
  return seed();
}
var S=load();
function normalize(){
  if(!S.me||typeof S.me!=="object") S.me={id:uid(),name:""};
  if(!S.me.id) S.me.id=uid();
  if(!S.players||typeof S.players!=="object"||Array.isArray(S.players)) S.players={};
  if(S.sync&&(typeof S.sync!=="object"||!S.sync.url||!S.sync.code)) S.sync=null;
  if(!Array.isArray(S.goals)) S.goals=[];
}
normalize();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var badgeTimer=null;
function save(){persist();markDirty();clearTimeout(badgeTimer);badgeTimer=setTimeout(checkBadges,600);}
function byId(id){return S.skills.filter(function(s){return s.id===id;})[0];}
function skillLabel(sk){
  var dup=S.skills.filter(function(o){return o.name===sk.name;}).length>1;
  return dup?sk.name+" ("+sk.sport+")":sk.name;
}
function isCardio(sk){return sk.kind==="cardio";}
function unitSuffix(sk){return isCardio(sk)?" "+sk.unit:"";}
function periodLabel(per){return {total:"",day:" today",week:" this week",month:" this month"}[per||"total"]||"";}

/* ---------- data ---------- */
function dayVal(sk,date,sid){return ((sk.log[date]||{})[sid])||0;}
function dayTotal(sk,date){return sk.sides.reduce(function(a,s){return a+dayVal(sk,date,s.id);},0);}
function total(sk,sid){var t=0;for(var d in sk.log){t+=sk.log[d][sid]||0;}return t;}
function allTotal(sk){return sk.sides.reduce(function(a,s){return a+total(sk,s.id);},0);}
function allToday(sk){return dayTotal(sk,today());}
function todayLine(sk){return fmt(allToday(sk))+unitSuffix(sk);}
function activeDays(sk){return Object.keys(sk.log).filter(function(d){return dayTotal(sk,d)>0;});}
function activeSet(skills){var set={}; skills.forEach(function(sk){activeDays(sk).forEach(function(d){set[d]=1;});}); return set;}
function currentStreak(set){
  var k=today(); if(!set[k]) k=addDays(k,-1);
  var c=0; while(set[k]){c++;k=addDays(k,-1);} return c;
}
function longestStreak(set){
  var keys=Object.keys(set).sort(), best=0, run=0, prev=null;
  keys.forEach(function(k){ run=(prev&&addDays(prev,1)===k)?run+1:1; if(run>best) best=run; prev=k; });
  return best;
}
function activeDaysLast(set,n){var c=0,tk=today();for(var i=0;i<n;i++){if(set[addDays(tk,-i)]) c++;}return c;}
function recentPace(sk,sid,n){var t=0,k=today();for(var i=0;i<n;i++){t+=dayVal(sk,addDays(k,-i),sid);}return t/n;}
function sumDays(sk,n){var t=0,k=today();for(var i=0;i<n;i++){t+=dayTotal(sk,addDays(k,-i));}return t;}
function bestDay(sk){
  var best=0, when=null;
  Object.keys(sk.log).forEach(function(d){var t=dayTotal(sk,d); if(t>best){best=t;when=d;}});
  return {n:best,date:when};
}
/* dates in the current goal period, up to today. null = all time */
function periodKeys(period){
  var tk=today(), keys=[], i, d;
  if(period==="day") return [tk];
  if(period==="week"){d=parseKey(tk); var off=(d.getDay()+6)%7; for(i=0;i<=off;i++) keys.push(addDays(tk,-i)); return keys;}
  if(period==="month"){d=parseKey(tk); for(i=0;i<d.getDate();i++) keys.push(addDays(tk,-i)); return keys;}
  return null;
}
function progress(sk,sid){
  var per=sk.period||"total";
  if(per==="total") return total(sk,sid);
  return periodKeys(per).reduce(function(a,k){return a+dayVal(sk,k,sid);},0);
}
function repsTotal(skills){return skills.reduce(function(a,sk){return a+(isCardio(sk)?0:allTotal(sk));},0);}
function kmTotal(skills){return skills.reduce(function(a,sk){return a+(isCardio(sk)?toKm(sk,allTotal(sk)):0);},0);}
/* days until every total-goal is met, at the last 14 days' pace. null = no estimate, 0 = done */
function etaDays(sk){
  if((sk.period||"total")!=="total") return null;
  var worst=0, has=false;
  for(var i=0;i<sk.sides.length;i++){
    var s=sk.sides[i]; if(!(s.target>0)) continue; has=true;
    var left=s.target-total(sk,s.id); if(left<=0) continue;
    var pace=recentPace(sk,s.id,14); if(pace<=0) return null;
    worst=Math.max(worst,Math.ceil(left/pace));
  }
  return has?worst:null;
}
function accuracy(sk){
  var made=null, missed=null;
  sk.sides.forEach(function(s){
    if(/^(made|caught)$/i.test(s.label)) made=s;
    if(/^(missed|dropped)$/i.test(s.label)) missed=s;
  });
  if(!made||!missed) return null;
  var a=total(sk,made.id), b=total(sk,missed.id);
  return (a+b)>0?Math.round(a/(a+b)*100):null;
}
function sideColor(sk,i){
  var l=sk.sides[i].label;
  if(/^(made|caught)$/i.test(l)) return "var(--good)";
  if(/^(missed|dropped)$/i.test(l)) return "var(--danger)";
  if(sk.sides.length===1) return "var(--tabon)";
  return PALETTE[i%PALETTE.length];
}

/* ---------- distance and time ---------- */
function toKm(sk,d){return sk.unit==="m"?d/1000:d;}
function mmss(m){var s=Math.round(m*60);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function paceStr(sk,dist,mins){
  if(!(dist>0)||!(mins>0)) return "–";
  var km=toKm(sk,dist), p=sk.pace||"perkm";
  if(p==="kmh") return (Math.round(km/(mins/60)*10)/10)+" km/h";
  if(p==="per100m") return mmss(mins/(km*10))+" /100m";
  return mmss(mins/km)+" /km";
}
function fmtDur(mins){
  if(!(mins>0)) return "–";
  var s=Math.round(mins*60), h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  return h>0?h+"h "+String(m).padStart(2,"0")+"m":m+"m "+String(sec).padStart(2,"0")+"s";
}
function speed(sk,x){return x.t>0?toKm(sk,x.d)/(x.t/60):0;}
function recomputeDay(sk,date){
  var d=0,t=0;
  (sk.sessions||[]).forEach(function(x){if(x.date===date){d+=x.d;t+=x.t;}});
  if(d<=0&&t<=0) delete sk.log[date]; else sk.log[date]={d:round3(d),t:round3(t)};
}
function addSession(sk,date,dist,mins){
  sk.sessions=sk.sessions||[];
  sk.sessions.push({id:uid(),date:date,d:round3(dist),t:round3(mins)});
  recomputeDay(sk,date); save();
}
function removeSession(sk,id){
  var s=(sk.sessions||[]).filter(function(x){return x.id===id;})[0]; if(!s) return;
  sk.sessions=sk.sessions.filter(function(x){return x.id!==id;});
  recomputeDay(sk,s.date); save();
}
function sessionForm(sk,date,withDate){
  var h='<div class="sform" data-skill="'+sk.id+'"'+(withDate?'':' data-date="'+date+'"')+'>';
  h+='<label>Distance ('+esc(sk.unit)+')</label><input type="number" inputmode="decimal" step="any" min="0" data-f="d" placeholder="e.g. 5.2" aria-label="Distance">';
  h+='<label>Time</label><div class="tgrid">'
    +'<div><input type="number" inputmode="numeric" min="0" data-f="h" placeholder="0" aria-label="Hours"><span>hr</span></div>'
    +'<div><input type="number" inputmode="numeric" min="0" data-f="m" placeholder="0" aria-label="Minutes"><span>min</span></div>'
    +'<div><input type="number" inputmode="numeric" min="0" data-f="s" placeholder="0" aria-label="Seconds"><span>sec</span></div></div>';
  if(withDate) h+='<label>Date</label><input type="date" data-f="date" value="'+date+'" max="'+today()+'">';
  h+='<div style="margin-top:12px"><button class="btn primary wide" data-act="addsess">Save session</button></div></div>';

}

  return {dist:num(f("d")),mins:Math.max(0,h)*60+Math.max(0,m)+Math.max(0,s)/60,date:f("date")||box.dataset.date};
}
function sessionRow(sk,x,showDate){
  return '<div class="srow"><div><b>'+fmt(x.d)+' '+esc(sk.unit)+'</b> in '+fmtDur(x.t)
    +'<div class="note" style="margin:2px 0 0">'+(showDate?midDay(x.date)+' · ':'')+paceStr(sk,x.d,x.t)+'</div></div>'

/* ---------- changing counts ---------- */
var undoStack=[];
function add(sk,sid,n,date){
  date=date||today();
  var curT=total(sk,sid), nextT=Math.max(0,curT+n), applied=nextT-curT;
  if(applied===0) return;
  var side=sk.sides.filter(function(s){return s.id===sid;})[0], before=progress(sk,sid);
  sk.log[date]=sk.log[date]||{};
  sk.log[date][sid]=Math.max(0,(sk.log[date][sid]||0)+applied);
  undoStack.push({skill:sk.id,side:sid,n:applied,date:date}); if(undoStack.length>50) undoStack.shift();
  save();
  var after=progress(sk,sid);
  if(applied>0 && side.target>0 && before<side.target && after>=side.target){
    toast("Goal reached: "+fmt(side.target)+" "+side.label.toLowerCase()+periodLabel(sk.period)+"!"); buzz([60,40,60,40,120]);
  } else if(applied>0 && (sk.period||"total")==="total" && Math.floor(nextT/1000)>Math.floor(curT/1000)){
    toast(fmt(Math.floor(nextT/1000)*1000)+" "+side.label.toLowerCase()+"! Keep going."); buzz([30,40,30]);
  } else buzz(8);
}
function setDay(sk,date,sid,value){
  sk.log[date]=sk.log[date]||{};
  sk.log[date][sid]=Math.max(0,value);
  save();
}
function undo(){
  var u=undoStack.pop(); if(!u){toast("Nothing to undo");return;}
  var sk=byId(u.skill); if(!sk||!sk.log[u.date]) return;
  sk.log[u.date][u.side]=Math.max(0,(sk.log[u.date][u.side]||0)-u.n);
  save(); refreshCounter();
}
function buzz(p){try{if(navigator.vibrate) navigator.vibrate(p);}catch(e){}}
var tt;
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},2400);}

function refreshCounter(){
  if(view.name!=="skill") return;

  var per=sk.period||"total";
  sk.sides.forEach(function(s){

    if(per!=="day") parts.push("today "+fmt(dayVal(sk,today(),s.id)));
    if(per!=="total") parts.push("all-time "+fmt(tv));
    var c=app.querySelector('[data-count="'+s.id+'"]'); if(c) c.textContent=fmt(pv);
    var o=app.querySelector('[data-of="'+s.id+'"]'); if(o) o.textContent=parts.join(" · ");
    var b=app.querySelector('[data-bar="'+s.id+'"]'); if(b) b.style.width=pct(pv,s.target)+"%";
  });
  function put(k,v){var e=app.querySelector('[data-stat="'+k+'"]'); if(e) e.textContent=v;}

    if(t) s.target=isCardio(sk)?Math.max(0,parseFloat(String(t.value).replace(",","."))||0):Math.max(0,parseInt(t.value,10)||0);
  });
}
function saveManage(){
  var sk=byId(view.id); collectManage(sk);
  if(!isCardio(sk)){
    sk.sides.forEach(function(s,i){
      var a=parseInt(document.getElementById("mA"+i).value,10);
      if(a) add(sk,s.id,a);
    });
  }
  save(); go({name:"skill",id:sk.id}); toast("Saved");
}

/* ---------- backup ---------- */
function renderBackup(){
  var h='<div class="top"><button class="icon" data-act="home" aria-label="Back">←</button><h1>Backup</h1></div>';
  h+='<p class="sub">Copy this text and keep it somewhere safe, like a note to yourself. To restore, paste it into the box and tap Restore.</p>';
  h+='<textarea id="bk" spellcheck="false">'+esc(JSON.stringify(S))+'</textarea>';
  h+='<div class="row" style="margin-top:12px"><button class="btn primary" style="flex:1" data-act="copy">Copy backup</button><button class="btn" style="flex:1" data-act="restore" id="restoreBtn">Restore</button></div>';
  app.innerHTML=h;
}
function copyBackup(){copyText(document.getElementById("bk").value,document.getElementById("bk"));}
function doRestore(){
  try{
    var d=JSON.parse(document.getElementById("bk").value);
    if(!d||!Array.isArray(d.skills)) throw new Error("bad");
    S=d; normalize(); save(); restoreArmed=false; go({name:"home"}); toast("Backup restored");
  }catch(e){restoreArmed=false;var b=document.getElementById("restoreBtn");if(b)b.textContent="Restore";toast("That doesn't look like a backup");}
}
function copyText(text,ta){
  function fallback(){ if(ta){ta.focus();ta.select();} try{document.execCommand("copy");toast("Copied");}catch(e){toast("Long-press the text to copy it");} }
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("Copied");},fallback);} else fallback(); }catch(e){fallback();}
}

/* ---------- calendar ---------- */
function dots(n){var s="";for(var i=0;i<Math.min(n,4);i++) s+="•";return s;}
function renderCal(){
  if(calFilter!=="all"&&!byId(calFilter)) calFilter="all";
  var skills=pickSkills(calFilter), single=(calFilter!=="all"&&skills.length===1)?skills[0]:null;
  var y=calMonth.y, m=calMonth.m;
  var first=new Date(y,m,1), n=new Date(y,m+1,0).getDate(), off=(first.getDay()+6)%7, tk=today();
  var vals={}, max=0, monthSum=0, activeCount=0, best=0, bestKey=null, d;
  for(d=1;d<=n;d++){
    var k=ymd(y,m,d);
    var v=single?dayTotal(single,k):skills.filter(function(sk){return dayTotal(sk,k)>0;}).length;
    vals[k]=v; if(v>max) max=v; monthSum+=v; if(v>0) activeCount++; if(v>best){best=v;bestKey=k;}
  }
  var denom=single?max:Math.max(1,skills.length), suf=single?unitSuffix(single):"";
  var nowM=new Date(), isCurrentOrFuture=(y>nowM.getFullYear())||(y===nowM.getFullYear()&&m>=nowM.getMonth());
  var h='<h1>Calendar</h1><p class="sub">Tap any day to add or fix what was done.</p>'+filterPills(calFilter,"calf",true);
  h+='<div class="month"><button class="icon" data-act="mprev" aria-label="Previous month">‹</button><h2>'+first.toLocaleDateString("en-NZ",{month:"long",year:"numeric"})+'</h2><button class="icon" data-act="mnext" aria-label="Next month"'+(isCurrentOrFuture?' disabled':'')+'>›</button></div>';
  h+='<div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="grid">';
  for(var i=0;i<off;i++) h+='<div class="cell blank"></div>';
  for(d=1;d<=n;d++){
    var key=ymd(y,m,d), val=vals[key], lvl=0;
    if(val>0&&denom>0){ var r=val/denom; lvl=r>0.75?5:r>0.5?4:r>0.25?3:r>0.1?2:1; }
    var op=[0,0.16,0.32,0.5,0.72,0.95][lvl], future=key>tk;
    var label=single?fmt(val)+suf:val+(val===1?" activity":" activities");
    h+='<button class="cell'+(lvl>=3?' hi':'')+(lvl>=4?' hi2':'')+(key===tk?' today':'')+'" data-act="day" data-date="'+key+'"'+(future?' disabled':'')+' aria-label="'+longDay(key)+': '+label+'">'
      +'<span class="heat" style="--h:'+op+'"></span><span class="d">'+d+'</span><span class="n">'+(val>0?(single?fmtShort(val):dots(val)):'')+'</span></button>';
  }
  h+='</div>';
  h+='<div class="legend">Less <i style="opacity:.2"></i><i style="opacity:.5"></i><i style="opacity:.95"></i> More</div>';
  h+='<div class="tiles">'
    +tile(single?fmt(monthSum)+suf:monthSum,single?'this month':'activities logged')
    +tile(activeCount,'active days')
    +tile(single?fmtShort(best)+suf:best,'best day'+(bestKey?' ('+shortDay(bestKey)+')':''))+'</div>';
  app.innerHTML=h;
}

/* ---------- a single day ---------- */
function renderDay(){
  var date=view.date, tk=today();
  var h='<div class="top"><button class="icon" data-act="tab" data-tab="cal" aria-label="Back to calendar">←</button><h1>'+longDay(date)+(date===tk?' (today)':'')+'</h1></div>';
  h+='<div class="daynav"><button class="btn" data-act="daynav" data-n="-1">‹ Previous day</button>'
    +'<button class="btn" data-act="daynav" data-n="1"'+(date>=tk?' disabled':'')+'>Next day ›</button></div>';
  h+='<p class="dtotal" data-daytotal></p>';
  if(!S.skills.length) h+='<div class="empty">No activities yet.</div>';
  S.skills.forEach(function(sk){
    h+='<div class="card"><div class="head"><span class="name">'+esc(sk.name)+'</span><span class="sport">'+esc(sk.sport)+'</span></div>';
    if(isCardio(sk)){
      var todays=(sk.sessions||[]).filter(function(x){return x.date===date;});
      h+=todays.length?todays.map(function(x){return sessionRow(sk,x,false);}).join(""):'<div class="note">No sessions on this day.</div>';
      h+=(view.open===sk.id)?sessionForm(sk,date,false):'<div style="margin-top:10px"><button class="btn wide" data-act="sessopen" data-skill="'+sk.id+'">Add a session</button></div>';
    } else {
      sk.sides.forEach(function(s,i){
        var a='data-skill="'+sk.id+'" data-side="'+s.id+'"';
        h+='<div class="drow" style="--c:'+sideColor(sk,i)+'"><div class="dl">'+esc(s.label)+'</div><div class="dctl">'
          +'<button data-act="dadj" '+a+' data-n="-10" aria-label="Remove 10">−10</button>'
          +'<button data-act="dadj" '+a+' data-n="-1" aria-label="Remove 1">−1</button>'
          +'<input type="number" inputmode="numeric" min="0" data-act="dset" '+a+' aria-label="'+esc(s.label)+' count for this day">'
          +'<button data-act="dadj" '+a+' data-n="1" aria-label="Add 1">+1</button>'
          +'<button data-act="dadj" '+a+' data-n="10" aria-label="Add 10">+10</button></div></div>';
      });
    }
    h+='</div>';
  });
  app.innerHTML=h;
  refreshDay();
}
function refreshDay(){
  if(view.name!=="day") return;
  var date=view.date, active=0;
  S.skills.forEach(function(sk){ if(dayTotal(sk,date)>0) active++; });
  Array.prototype.forEach.call(app.querySelectorAll('input[data-act="dset"]'),function(inp){
    var sk=byId(inp.dataset.skill); if(!sk) return;
    inp.value=dayVal(sk,date,inp.dataset.side);
  });
  var t=app.querySelector("[data-daytotal]");
  if(t) t.textContent=active>0?active+(active===1?" activity":" activities")+" logged on this day":"Nothing logged on this day yet.";
}

/* ---------- stats ---------- */
function summaryTiles(skills){
  var set=activeSet(skills), km=kmTotal(skills);
  return '<div class="tiles">'+tile(Object.keys(set).length,'active days')+tile(currentStreak(set),'day streak')+tile(longestStreak(set),'longest streak')
    +tile(activeDaysLast(set,7),'active days, last 7')+tile(fmt(repsTotal(skills)),'reps logged')+tile(fmt(Math.round(km*10)/10)+' km','distance logged')+'</div>';
}
function renderStats(){
  var h='<h1>Stats</h1><p class="sub">How the training is going.</p>'+summaryTiles(S.skills)+badgeRow({me:true,skills:S.skills},"stats");
  if(S.skills.length){
    if(!byId(statFilter)) statFilter=S.skills[0].id;
    h+='<h2>Daily activity</h2>'+filterPills(statFilter,"statf",false);
    h+=pills([["7","7 days"],["30","30 days"],["90","90 days"]],String(statRange),"range");
    h+=chartHtml(byId(statFilter));
  }
  h+='<h2>By activity</h2>';
  if(!S.skills.length) h+='<div class="empty">No activities yet.</div>';
  S.skills.forEach(function(sk){h+=skillCard(sk);});
  app.innerHTML=h;
}
function chartHtml(sk){
  var tk=today(), keys=[], i, suf=unitSuffix(sk);
  for(i=statRange-1;i>=0;i--) keys.push(addDays(tk,-i));
  var totals=keys.map(function(k){return dayTotal(sk,k);});
  var top=Math.max.apply(null,totals.concat([0])), max=Math.max(top,0.0001), sum=totals.reduce(function(a,b){return a+b;},0);
  var h='<div class="chart"><div class="bars'+(statRange===7?' w':'')+'">';
  keys.forEach(function(k,idx){
    var seg="";
    sk.sides.forEach(function(s,si){
      var v=dayVal(sk,k,s.id); if(v>0) seg+='<span class="seg" style="height:'+(v/max*100)+'%;background:'+sideColor(sk,si)+'"></span>';
    });
    h+='<button class="col" data-act="day" data-date="'+k+'" aria-label="'+midDay(k)+': '+fmt(totals[idx])+suf+'"><span class="stack">'+seg+'</span></button>';
  });
  h+='</div><div class="axis"><span>'+shortDay(keys[0])+'</span><span>tallest day: '+fmt(top)+suf+'</span><span>Today</span></div>';
  if(sk.sides.length>1){
    h+='<div class="key">'; sk.sides.forEach(function(s,si){h+='<span><i style="background:'+sideColor(sk,si)+'"></i>'+esc(s.label)+'</span>';}); h+='</div>';
  }
  h+='<div class="note" style="margin-bottom:0">'+fmt(sum)+suf+' in '+statRange+' days, about '+fmt(Math.round(sum/statRange*10)/10)+suf+' a day. Tap a bar to open that day.</div></div>';
  return h;
}
function skillCard(sk){
  var days=activeDays(sk), bd=bestDay(sk), suf=unitSuffix(sk), h;
  h='<div class="card"><div class="head"><span class="name">'+esc(sk.name)+'</span><span class="sport">'+esc(sk.sport)+'</span></div>'+sideRows(sk);
  if(isCardio(sk)){
    var sess=sk.sessions||[], dist=total(sk,"d"), mins=total(sk,"t"), longest=0, best=null;
    sess.forEach(function(x){ if(x.d>longest) longest=x.d; if(x.t>0&&(!best||speed(sk,x)>speed(sk,best))) best=x; });
    h+='<div class="kv">'
      +'<div><b>'+sess.length+'</b><span>sessions</span></div>'
      +'<div><b>'+fmt(dist)+suf+'</b><span>total distance</span></div>'
      +'<div><b>'+fmtDur(mins)+'</b><span>total time</span></div>'
      +'<div><b>'+paceStr(sk,dist,mins)+'</b><span>average pace</span></div>'
      +'<div><b>'+(best?paceStr(sk,best.d,best.t):'–')+'</b><span>best pace</span></div>'
      +'<div><b>'+fmt(longest)+suf+'</b><span>longest session</span></div>'
      +'<div><b>'+days.length+'</b><span>active days</span></div>'
      +'<div><b>'+fmt(Math.round(sumDays(sk,7)*100)/100)+suf+'</b><span>last 7 days</span></div></div>';
  } else {
    var acc=accuracy(sk), tot=allTotal(sk);
    h+='<div class="kv">'
      +'<div><b>'+days.length+'</b><span>active days</span></div>'
      +'<div><b>'+(days.length?fmt(Math.round(tot/days.length)):'–')+'</b><span>average per active day</span></div>'
      +'<div><b>'+fmt(bd.n)+'</b><span>best day'+(bd.date?' ('+shortDay(bd.date)+')':'')+'</span></div>'
      +'<div><b>'+fmt(sumDays(sk,7))+'</b><span>last 7 days</span></div>'
      +(acc!==null?'<div><b>'+acc+'%</b><span>accuracy</span></div>':'')+'</div>';
  }
  if((sk.period||"total")==="total"){
    var lines="";
    sk.sides.forEach(function(s){
      if(!(s.target>0)) return;
      var left=s.target-total(sk,s.id), l;
      if(left<=0) l="goal reached";
      else {
        var pace=recentPace(sk,s.id,14);
        l=pace>0?"about "+fmt(Math.ceil(left/pace))+" days ("+midDay(addDays(today(),Math.ceil(left/pace)))+")":"no recent activity";
      }
      lines+='<div>'+esc(s.label)+': '+l+'</div>';
    });
    if(lines) h+='<div class="eta"><span>Finish estimate at the last 14 days\' pace</span>'+lines+'</div>';
  }
  return h+'</div>';
}

function b64FromBytes(u8){var s="";for(var i=0;i<u8.length;i+=0x8000){s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));}return btoa(s);}
function bytesFromB64(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function encodeShare(obj){
  var bytes=new TextEncoder().encode(JSON.stringify(obj));
  try{
    if(typeof CompressionStream!=="undefined"){
      var cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
      var buf=await new Response(cs).arrayBuffer();
      return "ST2:"+b64FromBytes(new Uint8Array(buf))+"~";
    }
  }catch(e){}
  return "ST1:"+b64FromBytes(bytes)+"~";
}
async function decodeShare(text){
  var m=String(text).match(/(ST[12]):([A-Za-z0-9+\/=\s]+)/);
  if(!m) throw new Error("no code");
  var bytes=bytesFromB64(m[2].replace(/\s+/g,""));
  if(m[1]==="ST2"){
    var ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    bytes=new Uint8Array(await new Response(ds).arrayBuffer());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function cleanSkills(arr){
  return arr.slice(0,40).map(function(sk){
    sk=sk&&typeof sk==="object"?sk:{};
    var card=sk.kind==="cardio";
    var out={id:String(sk.id||uid()).slice(0,20),sport:String(sk.sport||"Other").slice(0,40),name:String(sk.name||"Activity").slice(0,40),
      kind:card?"cardio":"count",period:PERIOD_IDS.indexOf(sk.period)>=0?sk.period:"total",sides:[],log:{}};
    if(card){
      out.unit=sk.unit==="m"?"m":"km";
      out.pace=PACE_IDS.indexOf(sk.pace)>=0?sk.pace:"perkm";
      var t0=(Array.isArray(sk.sides)&&sk.sides[0])?parseFloat(sk.sides[0].target):0;
      out.sides=[{id:"d",label:"Distance",target:Math.max(0,isFinite(t0)?t0:0)}];
      out.sessions=[];
      (Array.isArray(sk.sessions)?sk.sessions:[]).slice(0,4000).forEach(function(x){
        if(!x||!validDate(x.date)) return;
        var d=parseFloat(x.d), t=parseFloat(x.t);
        if(!(d>0)||!isFinite(d)||d>100000) return;
        out.sessions.push({id:String(x.id||uid()).slice(0,20),date:x.date,d:round3(d),t:isFinite(t)&&t>0&&t<100000?round3(t):0});
      });
    } else {
      (Array.isArray(sk.sides)?sk.sides:[]).slice(0,MAX_OPTS).forEach(function(s){
        s=s||{}; out.sides.push({id:String(s.id||uid()).slice(0,20),label:String(s.label||"").slice(0,20),target:Math.max(0,parseInt(s.target,10)||0)});
      });
    }
    var log=(sk.log&&typeof sk.log==="object")?sk.log:{};
    Object.keys(log).slice(0,6000).forEach(function(d){
      if(!validDate(d)) return;
      var o={}, src=log[d]||{};
      Object.keys(src).slice(0,10).forEach(function(k){var v=parseFloat(src[k]); if(v>0&&isFinite(v)&&v<10000000) o[k]=round3(v);});
      out.log[d]=o;
    });
    return out;
  });
}

function allPlayers(){
  var list=[];

  Object.keys(S.players).forEach(function(id){var p=S.players[id]; list.push({id:id,name:p.name,skills:p.skills,at:p.at,me:false});});
  return list;
}
function pDay(p,key,date){
  return p.skills.reduce(function(a,sk){return a+(skKey(sk)===key?dayTotal(sk,date):0);},0);
}
function teamSkillKeys(players){
  var seen={}, out=[];
  players.forEach(function(p){p.skills.forEach(function(sk){var k=skKey(sk); if(!seen[k]){seen[k]=1; out.push({key:k,name:sk.name,sport:sk.sport,unit:isCardio(sk)?" "+sk.unit:""});}});});
  return out;
}

function badgeStats(skills){
  var set=activeSet(skills), weeks={}, longest=0, goals=0;
  skills.forEach(function(sk){
    activeDays(sk).forEach(function(d){
      var dt=parseKey(d), wk=addDays(d,-((dt.getDay()+6)%7));
      var w=weeks[wk]||(weeks[wk]={days:{},acts:{}});
      w.days[d]=1; w.acts[sk.id]=1;
    });
    if(isCardio(sk)&&(sk.pace||"perkm")==="perkm"){
      (sk.sessions||[]).forEach(function(x){var k=toKm(sk,x.d); if(k>longest) longest=k;});
    }
    if((sk.period||"total")==="total"){
      sk.sides.forEach(function(sd){ if(sd.target>0&&total(sk,sd.id)>=sd.target) goals++; });
    }
  });
  var wd=0, wv=0;
  Object.keys(weeks).forEach(function(k){
    wd=Math.max(wd,Object.keys(weeks[k].days).length);
    wv=Math.max(wv,Object.keys(weeks[k].acts).length);
  });
  return {days:Object.keys(set).length,streak:longestStreak(set),reps:repsTotal(skills),km:kmTotal(skills),longest:longest,weekdays:wd,variety:wv,goals:goals};

function keysFor(period){
  if(period==="year"){
    var tk=today(), t=parseKey(tk), n=Math.floor((t-new Date(t.getFullYear(),0,1))/86400000)+1, keys=[];
    for(var i=0;i<n;i++) keys.push(addDays(tk,-i));
    return keys;
  }
  return periodKeys(period);
}
function daysLeft(period){
  var t=parseKey(today());
  if(period==="week") return 6-((t.getDay()+6)%7);
  if(period==="month") return new Date(t.getFullYear(),t.getMonth()+1,0).getDate()-t.getDate();
  return Math.round((new Date(t.getFullYear(),11,31)-t)/86400000);
}
function cleanGoals(arr){
  var out=[];
  (Array.isArray(arr)?arr:[]).slice(0,20).forEach(function(g){
    if(!g||typeof g!=="object") return;
    var t=parseFloat(g.target); if(!(t>0)||!isFinite(t)||t>10000000) return;
    out.push({id:String(g.id||uid()).replace(/[^A-Za-z0-9]/g,"").slice(0,20)||uid(),metric:String(g.metric||"days").slice(0,100),
      period:["week","month","year"].indexOf(g.period)>=0?g.period:"week",mode:g.mode==="together"?"together":"each",target:t,name:String(g.name||"").slice(0,40)});
  });
  return out;
}
function goalInfo(g,keys){
  if(g.metric==="days") return {name:"active days",unit:" days",days:true};
  var k=keys.filter(function(x){return x.key===g.metric;})[0];
  return {name:k?k.name:String(g.metric).split("|")[1]||"activity",unit:k?k.unit:"",days:false};
}
function goalTitle(g,info){
  if(g.name) return g.name;
  var per={week:"this week",month:"this month",year:"this year"}[g.period];
  var what=info.days?fmt(g.target)+" active days":info.name+" "+fmt(g.target)+info.unit;
  return g.mode==="together"?what+" together "+per:"Everyone: "+what+" "+per;
}

/* ---------- family sync through a Google Sheet ---------- */
var sync={busy:false,pulling:false,timer:null,err:"",raw:[],ver:0,offArmed:false,confirmId:null};
function syncOn(){return !!(S.sync&&S.sync.url&&S.sync.code);}
function syncMember(){return syncOn()&&S.sync.mode==="member";}
function friendlyErr(e){
  var m=String((e&&e.message)||e||"");
  if(m==="bad_code") return "The family code doesn't match the one in your script.";
  if(m==="set_code") return "Change the family code inside the script first.";
  if(m==="bad_reply") return "Couldn't read the reply. Check the web app is set to share with Anyone.";
  if(/Failed to fetch|NetworkError|Load failed|TypeError/i.test(m)) return "Couldn't reach the sheet. Check your connection and the address.";
  return "Sync problem: "+m.slice(0,80);
}
function rawCall(url,code,action,extra,keep){
  var body=JSON.stringify(Object.assign({action:action,code:code},extra||{}));
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body,keepalive:!!keep&&body.length<60000})
    .then(function(r){return r.text();})
    .then(function(t){try{return JSON.parse(t);}catch(e){throw new Error("bad_reply");}});
}
function logRows(skills){
  var rows=[];
  skills.forEach(function(sk){
    if(isCardio(sk)){
      (sk.sessions||[]).forEach(function(x){rows.push([x.date,sk.sport,sk.name,"Session",x.d,sk.unit,round3(x.t)]);});
    } else {
      Object.keys(sk.log).sort().forEach(function(d){
        sk.sides.forEach(function(s){var v=sk.log[d][s.id]; if(v>0) rows.push([d,sk.sport,sk.name,s.label,v,"reps",""]);});
      });
    }
  });
  return rows.slice(0,20000);
}
function markDirty(){
  if(!syncMember()) return;
  sync.ver++; S.sync.dirty=true; persist();
  clearTimeout(sync.timer); sync.timer=setTimeout(syncFlush,4000);
}
function syncFlush(keep){
  clearTimeout(sync.timer);
  if(!syncMember()||!S.sync.dirty||sync.busy) return Promise.resolve();
  sync.busy=true;
  var ver=sync.ver, data=JSON.stringify({skills:S.skills});
  return rawCall(S.sync.url,S.sync.code,"push",{id:S.me.id,name:shareName()||"Player",data:data,rows:logRows(S.skills)},keep===true)
    .then(function(res){
      sync.busy=false;
      if(!res.ok) throw new Error(res.error||"failed");
      sync.err=""; S.sync.pushedAt=Date.now();
      if(sync.ver===ver) S.sync.dirty=false; else { clearTimeout(sync.timer); sync.timer=setTimeout(syncFlush,2000); }
      persist();
    })
    .catch(function(e){ sync.busy=false; sync.err=friendlyErr(e); clearTimeout(sync.timer); sync.timer=setTimeout(syncFlush,30000); })
    .then(function(){ if(view.name==="team") renderTeam(); });
}
function applyFamily(list){
  sync.raw=list;
  var before=JSON.stringify([S.players,S.goals]), seen={};
  list.forEach(function(p){
    if(p&&p.id==="familygoals"){
      if(!S.goalsDirty){ try{var go=JSON.parse(p.data); if(go&&Array.isArray(go.goals)) S.goals=cleanGoals(go.goals);}catch(e){} }
      return;
    }
    if(!p||!/^[A-Za-z0-9]{3,20}$/.test(String(p.id))||p.id===S.me.id) return;
    var obj; try{obj=JSON.parse(p.data);}catch(e){return;}
    if(!obj||!Array.isArray(obj.skills)) return;
    seen[p.id]=1;
    S.players[p.id]={id:p.id,name:String(p.name||"Player").slice(0,30),skills:cleanSkills(obj.skills),at:p.at||0,via:"sync"};
  });
  Object.keys(S.players).forEach(function(id){ if(S.players[id].via==="sync"&&!seen[id]) delete S.players[id]; });
  return before!==JSON.stringify([S.players,S.goals]);
}
function syncPull(force){
  if(!syncOn()) return Promise.resolve();
  if(sync.pulling) return Promise.resolve();
  sync.pulling=true;
  return rawCall(S.sync.url,S.sync.code,"pull",{})
    .then(function(res){
      sync.pulling=false;
      if(!res.ok) throw new Error(res.error||"failed");
      var changed=applyFamily(res.players||[]);
      sync.err=""; S.sync.pulledAt=Date.now(); persist();
      if(S.goalsDirty||(S.goals.length&&!(res.players||[]).some(function(p){return p.id==="familygoals";}))) pushGoals();
      if(view.name==="team"&&(changed||force||sync.errShown)){ sync.errShown=false; renderTeam(); }
    })
    .catch(function(e){ sync.pulling=false; sync.err=friendlyErr(e); sync.errShown=true; if(view.name==="team") renderTeam(); });
}
function agoText(ms){
  if(!ms) return "never";
  var m=Math.round((Date.now()-ms)/60000);
  if(m<1) return "just now";
  if(m<60) return m+" min ago";
  var h=Math.round(m/60);
  if(h<24) return h+" h ago";
  return shortDay(keyOf(new Date(ms)));
}
function syncCard(){
  var h='<div class="card" style="margin-top:12px">';
  if(!syncOn()){
    h+='<div class="head"><span class="name">Family sync</span></div><div class="note" style="margin-top:0">Share everyone\'s stats automatically through a Google Sheet. No codes to send.</div>'
      +'<div style="margin-top:10px"><button class="btn primary wide" data-act="sync-setup">Set up family sync</button></div>';
  } else {
    var who=S.sync.mode==="watch"?"Watching the family":(S.sync.mode==="member"?"Syncing as "+esc(shareName()||"you"):"Not finished");
    h+='<div class="head"><span class="name">Family sync</span><span class="sport">'+who+'</span></div>';
    if(!S.sync.mode){
      h+='<button class="btn primary wide" data-act="sync-change">Choose who this phone is</button>';
    } else {
      h+='<div class="note" style="margin-top:0;'+(sync.err?'color:var(--danger)':'')+'">'+(sync.err?esc(sync.err):'Last updated '+agoText(S.sync.pulledAt))
        +(!sync.err&&syncMember()&&S.sync.dirty?' · changes waiting to upload':'')+'</div>';
      h+='<div class="row" style="margin-top:8px"><button class="btn" style="flex:1" data-act="syncnow">Sync now</button><button class="btn" style="flex:1" data-act="sync-change">Change who I am</button></div>';
    }
    h+='<button class="linkbtn" data-act="syncoff" id="syncOff">Disconnect this phone</button>';
  }
  return h+'</div>';
}
function renderSyncSetup(){
  var h='<div class="top"><button class="icon" data-act="tab" data-tab="team" aria-label="Back">←</button><h1>Family sync</h1></div>';
  h+='<p class="sub">Paste the web app address and the family code from your Google Sheet script.</p>';
  h+='<label for="syUrl">Web app address</label><input type="text" id="syUrl" value="'+esc((S.sync&&S.sync.url)||"")+'" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocomplete="off">';
  h+='<label for="syCode">Family code</label><input type="text" id="syCode" value="'+esc((S.sync&&S.sync.code)||"")+'" autocapitalize="off" autocomplete="off">';
  h+='<div style="margin-top:14px"><button class="btn primary wide" data-act="syncconnect">Connect</button></div>';
  h+='<p class="note">Treat the code like a password. Anyone with the address and code can see and add stats.</p>';
  app.innerHTML=h;
}
function renderSyncWho(){
  var fam=(sync.raw||[]).filter(function(p){return p&&p.id&&p.id!=="familygoals";});
  var h='<div class="top"><button class="icon" data-act="tab" data-tab="team" aria-label="Back">←</button><h1>Who is this phone?</h1></div>';
  if(fam.length){
    h+='<p class="sub">Tap your name if you are already in the family.</p>';
    fam.forEach(function(p){h+='<button class="btn wide" style="margin-bottom:8px" data-act="syncme" data-id="'+esc(p.id)+'">'+esc(p.name)+(p.id===S.me.id?' (this phone)':'')+'</button>';});
  } else {
    h+='<p class="sub">No one has joined yet. You can be the first.</p>';
  }
  h+='<label for="syName">New here? Your name</label><input type="text" id="syName" value="'+esc(S.me.name)+'" maxlength="30" placeholder="e.g. Sam">';
  h+='<div style="margin-top:10px"><button class="btn primary wide" data-act="syncnew">Add me to the family</button></div>';
  h+='<div style="margin-top:18px"><button class="btn wide" data-act="syncwatch">Just watching</button></div>';
  h+='<p class="note">Watching shows everyone\'s stats on this phone without sharing anything from it.</p>';
  app.innerHTML=h;
}
function adoptPlayer(id){
  var p=(sync.raw||[]).filter(function(x){return x.id===id;})[0]; if(!p) return;
  if(id!==S.me.id){
    var obj=null; try{obj=JSON.parse(p.data);}catch(e){}
    var skills=(obj&&Array.isArray(obj.skills))?cleanSkills(obj.skills):[];
    S.skills=skills.length?skills:seed().skills;
    S.me={id:id,name:String(p.name||"").slice(0,30)};
  }
  delete S.players[id];
  S.sync.mode="member"; S.sync.dirty=false; persist();
}
function hasLocalData(){return S.skills.some(function(sk){return allTotal(sk)>0;});}

/* ---------- wake lock ---------- */
function releaseWake(){try{if(wake){wake.release();wake=null;}}catch(e){}}
async function toggleWake(btn){
  if(wake){releaseWake();btn.setAttribute("aria-pressed","false");btn.textContent="Keep screen on";return;}
  try{
    wake=await navigator.wakeLock.request("screen");
    btn.setAttribute("aria-pressed","true");btn.textContent="Screen stays on";
  }catch(e){toast("This browser can't keep the screen on");}
}

/* ---------- events ---------- */
var delArmed=false, restoreArmed=false, remArmed=null, remPlayer=null, sessArmed=null;
document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]"); if(!el||el.disabled) return;
  var act=el.dataset.act, sk, i, f;
  if(view.name==="add") readForm();
  if(view.name==="addgoal") readGoalForm();
  switch(act){
    case "tab":
      if(el.dataset.tab==="home") go({name:"home"});
      else if(el.dataset.tab==="cal") go({name:"cal"});
      else if(el.dataset.tab==="team") go({name:"team"});
      else go({name:"stats"});
      break;
    case "sync-setup": go({name:"syncsetup"}); break;
    case "syncconnect":
      var sUrl=document.getElementById("syUrl").value.trim(), sCode=document.getElementById("syCode").value.trim();
      if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(sUrl)){toast("That doesn't look like a Google Apps Script address");break;}
      if(!sCode){toast("Enter the family code");break;}
      el.disabled=true; el.textContent="Connecting…";
      rawCall(sUrl,sCode,"pull",{}).then(function(res){
        if(!res.ok) throw new Error(res.error||"failed");
        S.sync={url:sUrl,code:sCode,mode:"",dirty:false,pulledAt:Date.now()};
        applyFamily(res.players||[]); persist(); go({name:"syncwho"});
      }).catch(function(err){ el.disabled=false; el.textContent="Connect"; toast(friendlyErr(err)); });
      break;
    case "sync-change":
      toast("Checking the family…");
      rawCall(S.sync.url,S.sync.code,"pull",{}).then(function(res){
        if(!res.ok) throw new Error(res.error||"failed");
        applyFamily(res.players||[]); persist(); go({name:"syncwho"});
      }).catch(function(err){ toast(friendlyErr(err)); });
      break;
    case "syncme":
      var pid=el.dataset.id;
      if(pid!==S.me.id&&hasLocalData()&&sync.confirmId!==pid){
        sync.confirmId=pid; el.textContent="Tap again to replace this phone's counts";
        setTimeout(function(){sync.confirmId=null;},5000); break;
      }
      sync.confirmId=null; adoptPlayer(pid);
      go({name:"team"}); toast("Connected"); syncPull(true);
      break;
    case "syncnew":
      var nm=document.getElementById("syName").value.trim().slice(0,30);
      if(!nm){toast("Add your name first");break;}
      S.me.name=nm; S.sync.mode="member"; S.sync.dirty=true; sync.ver++; persist();
      go({name:"team"}); toast("Connected");
      syncFlush().then(function(){return syncPull(true);});
      break;
    case "syncwatch":
      S.sync.mode="watch"; S.sync.dirty=false; persist();
      go({name:"team"}); toast("Connected"); syncPull(true);
      break;
    case "syncnow":
      toast("Syncing…");
      syncFlush().then(function(){return syncPull(true);}).then(function(){ toast(sync.err?"Sync failed":"Up to date"); });
      break;
    case "syncoff":
      if(!sync.offArmed){ sync.offArmed=true; el.textContent="Tap again to disconnect"; setTimeout(function(){sync.offArmed=false;var b=document.getElementById("syncOff");if(b)b.textContent="Disconnect this phone";},4000); }
      else {
        sync.offArmed=false; S.sync=null; sync.err="";
        Object.keys(S.players).forEach(function(id){delete S.players[id].via;});
        persist(); renderTeam(); toast("Disconnected. Your counts stay on this phone.");
      }
      break;
    case "share-go": go({name:"share"}); break;
    case "addp-go": go({name:"addplayer"}); break;
    case "copycode": if(needName()) break; copyText(document.getElementById("shCode").value,document.getElementById("shCode")); break;
    case "sharecode":
      if(needName()) break;
      var code=document.getElementById("shCode").value;
      try{ navigator.share({title:"Skill Tally stats",text:code}).catch(function(){ copyText(code,document.getElementById("shCode")); }); }
      catch(err){ copyText(code,document.getElementById("shCode")); }
      break;
    case "addp": addPlayer(); break;
    case "prm":
      if(remPlayer!==el.dataset.id){
        remPlayer=el.dataset.id; el.textContent="Tap again to remove";
        setTimeout(function(){remPlayer=null;if(view.name==="team")renderTeam();},4000);
      } else { delete S.players[el.dataset.id]; remPlayer=null; persist(); renderTeam(); toast("Player removed"); }
      break;
    case "badges": go({name:"badges",id:el.dataset.id,back:el.dataset.back||"team"}); break;
    case "goal-new": go({name:"addgoal"}); break;
    case "gmetric": view.gf.metric=el.dataset.v; renderAddGoal(); break;
    case "gperiod": view.gf.period=el.dataset.v; renderAddGoal(); break;
    case "gmode": view.gf.mode=el.dataset.v; renderAddGoal(); break;
    case "goalcreate":
      var gt=parseFloat(String(view.gf.target).replace(",","."));
      if(!(gt>0)){toast("Enter a target");break;}
      S.goals.push({id:uid(),metric:view.gf.metric,period:view.gf.period,mode:view.gf.mode,target:gt,name:(view.gf.name||"").trim().slice(0,40)});
      view.gf=null; pushGoals(); go({name:"team"}); toast("Goal added");
      break;
    case "goaldel":
      if(goalDelArmed!==el.dataset.id){
        goalDelArmed=el.dataset.id; el.textContent="Tap again to delete";
        var gid=el.dataset.id; setTimeout(function(){goalDelArmed=null;var b=document.querySelector('[data-act="goaldel"][data-id="'+gid+'"]');if(b)b.textContent="Delete this goal";},4000);
      } else {
        S.goals=S.goals.filter(function(g){return g.id!==el.dataset.id;}); goalDelArmed=null; pushGoals(); renderTeam(); toast("Goal deleted");
      }
      break;
    case "chalm": chalMetric=el.dataset.v; renderTeam(); break;
    case "chalp": chalPeriod=el.dataset.v; renderTeam(); break;
    case "teamf": teamFilter=el.dataset.v; renderTeam(); break;
    case "teamr": teamRange=parseInt(el.dataset.v,10); renderTeam(); break;

    case "open": go({name:"skill",id:el.dataset.id}); break;
    case "home": go({name:"home"}); break;
    case "add-new": go({name:"add"}); break;
    case "backup": go({name:"backup"}); break;
    case "manage": go({name:"manage",id:view.id}); break;
    case "past": calFilter=view.id; go({name:"cal"}); break;
    case "add1": sk=byId(view.id); add(sk,el.dataset.side,1); refreshCounter(); break;
    case "addn": sk=byId(view.id); add(sk,el.dataset.side,parseInt(el.dataset.n,10)); refreshCounter(); break;
    case "undo": undo(); break;
    case "wake": toggleWake(el); break;

    case "sport": view.form=newForm(el.dataset.v,0); renderAdd(); break;
    case "preset": view.form=fromPreset(view.form.sport,SPORTS[view.form.sport][parseInt(el.dataset.i,10)]); renderAdd(); break;
    case "kind":
      f=view.form;
      if(el.dataset.v!==f.kind){
        f.kind=el.dataset.v;
        f.opts=f.kind==="cardio"?[{label:"Distance",target:0}]:[{label:"Total",target:10000}];
        if(f.kind==="cardio"&&f.period==="total") f.period="month";
      }
      renderAdd(); break;
    case "unit": view.form.unit=el.dataset.v; renderAdd(); break;
    case "pacep": view.form.pace=el.dataset.v; renderAdd(); break;
    case "period": view.form.period=el.dataset.v; renderAdd(); break;
    case "aopt": view.form.opts.push({label:"",target:10000}); renderAdd(); break;
    case "ropt": view.form.opts.splice(parseInt(el.dataset.i,10),1); renderAdd(); break;
    case "create": createSkill(); break;

    case "mperiod": sk=byId(view.id); collectManage(sk); sk.period=el.dataset.v; save(); renderManage(); break;
    case "mpace": sk=byId(view.id); collectManage(sk); sk.pace=el.dataset.v; save(); renderManage(); break;
    case "maopt": sk=byId(view.id); collectManage(sk); sk.sides.push({id:uid(),label:"New option",target:0}); save(); renderManage(); break;
    case "mrem":
      i=parseInt(el.dataset.i,10); sk=byId(view.id);
      if(remArmed!==i){
        remArmed=i; el.textContent="?"; toast("Tap again to remove this option and its counts");
        setTimeout(function(){remArmed=null;var b=app.querySelector('[data-act="mrem"][data-i="'+i+'"]');if(b)b.textContent="×";},4000);
      } else {
        collectManage(sk);
        var gone=sk.sides.splice(i,1)[0];
        Object.keys(sk.log).forEach(function(d){delete sk.log[d][gone.id];});
        remArmed=null; save(); renderManage();
      }
      break;
    case "msave": saveManage(); break;
    case "delete":
      if(!delArmed){delArmed=true;el.textContent="Tap again to delete for good";setTimeout(function(){delArmed=false;var b=document.getElementById("delBtn");if(b)b.textContent="Delete this activity";},4000);}
      else{S.skills=S.skills.filter(function(s){return s.id!==view.id;});save();delArmed=false;go({name:"home"});toast("Activity deleted");}
      break;
    case "copy": copyBackup(); break;
    case "restore":
      if(!restoreArmed){restoreArmed=true;el.textContent="Tap again to replace everything";setTimeout(function(){restoreArmed=false;var b=document.getElementById("restoreBtn");if(b)b.textContent="Restore";},4000);}
      else doRestore();
      break;

    case "calf": calFilter=el.dataset.v; renderCal(); break;
    case "mprev": calMonth={y:calMonth.m===0?calMonth.y-1:calMonth.y,m:(calMonth.m+11)%12}; renderCal(); break;
    case "mnext": calMonth={y:calMonth.m===11?calMonth.y+1:calMonth.y,m:(calMonth.m+1)%12}; renderCal(); break;
    case "day":
      var p=el.dataset.date.split("-"); calMonth={y:+p[0],m:+p[1]-1};
      go({name:"day",date:el.dataset.date}); break;
    case "daynav":
      var nd=addDays(view.date,parseInt(el.dataset.n,10));
      if(nd>today()) break;
      var q=nd.split("-"); calMonth={y:+q[0],m:+q[1]-1};
      go({name:"day",date:nd}); break;
    case "dadj":
      sk=byId(el.dataset.skill);
      setDay(sk,view.date,el.dataset.side,dayVal(sk,view.date,el.dataset.side)+parseInt(el.dataset.n,10));
      buzz(6); refreshDay(); break;
    case "sessopen": view.open=el.dataset.skill; renderDay(); break;
    case "addsess":
      var box=el.closest(".sform"); sk=byId(box.dataset.skill);
      var r=readSession(box);
      if(!(r.dist>0)){toast("Add the distance");break;}
      if(!validDate(r.date)||r.date>today()){toast("Choose a date up to today");break;}
      var beforeP=progress(sk,"d");
      addSession(sk,r.date,r.dist,r.mins);
      var afterP=progress(sk,"d"), tg=sk.sides[0].target;
      if(tg>0&&beforeP<tg&&afterP>=tg){ toast("Goal reached: "+fmt(tg)+" "+sk.unit+periodLabel(sk.period)+"!"); buzz([60,40,60,40,120]); }
      else { toast("Saved "+fmt(r.dist)+" "+sk.unit+(r.mins>0?" · "+paceStr(sk,r.dist,r.mins):"")); buzz([30,30,30]); }
      if(view.name==="day") view.open=null;
      render(); break;
    case "dsess":
      if(sessArmed!==el.dataset.id){
        sessArmed=el.dataset.id; el.textContent="Tap again";
        var sid=el.dataset.id;
        setTimeout(function(){sessArmed=null;var b=document.querySelector('[data-act="dsess"][data-id="'+sid+'"]');if(b)b.textContent="Delete";},4000);
      } else { removeSession(byId(el.dataset.skill),el.dataset.id); sessArmed=null; render(); toast("Session deleted"); }
      break;

    case "statf": statFilter=el.dataset.v; renderStats(); break;
    case "range": statRange=parseInt(el.dataset.v,10); renderStats(); break;
  }
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el&&el.id==="shName"&&view.name==="share"){ S.me.name=el.value.trim().slice(0,30); save(); makeCode(); return; }
  if(el&&el.dataset&&el.dataset.act==="dset"&&view.name==="day"){
    var sk=byId(el.dataset.skill); if(!sk) return;
    setDay(sk,view.date,el.dataset.side,Math.max(0,parseInt(el.value,10)||0));
    refreshDay();
  }
});

document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){ if(syncMember()&&S.sync.dirty) syncFlush(true); }
  else if(syncOn()&&view.name==="team") syncPull();
});
setInterval(function(){ if(syncOn()&&view.name==="team"&&document.visibilityState==="visible") syncPull(); },60000);

if(!Array.isArray(S.badges)){ S.badges=badgeList(S.skills).filter(function(b){return b.earned;}).map(function(b){return b.id;}); persist(); }
render();
if(syncOn()){ if(syncMember()&&S.sync.dirty) syncFlush(); syncPull(); }
})();

</script>
