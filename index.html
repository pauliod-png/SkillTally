<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A9D0F0">
<title>Dickson Family</title>
<style>
:root{
  /* Sky palette: Northland sky blue #6CACE4 (Pantone 284) as the main colour, Canterbury red #C8102E for accents */
  --bg:#A9D0F0; --surface:#FFFFFF; --surface2:#E4F1FC; --line:#7FB0DC;
  --text:#0B2447; --muted:#2C4A72; --solo:#C8102E; --tabon:#1D63B0; --heat:#2570B8; --hi:#0B2447; --hi2:#FFFFFF;
  --left:#1D63B0; --right:#9A5800; --c2:#0C7350; --c3:#6B3FB0; --c4:#B02C63; --c5:#A9480B;
  --good:#0F7F3B; --danger:#B3261E; --on-accent:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
:root[data-theme="dark"]{ color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;background:var(--bg);color:var(--text);}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;min-height:100vh;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;border:0;background:none;padding:0;}
button:disabled{opacity:.35;cursor:default;}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--tabon);outline-offset:2px;}
#app{max-width:560px;margin:0 auto;padding:14px 16px 110px;}
h1{font-size:26px;margin:6px 0 2px;letter-spacing:-.01em;}
h2{font-size:18px;margin:24px 0 8px;}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;}
.brand{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;}
/* wordmark */
.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--text);margin-top:4px;}
.kicker::before{content:"";display:inline-block;width:24px;height:4px;background:var(--solo);border-radius:2px;margin-right:8px;vertical-align:middle;}
.brand h1{font-size:32px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px;}
.brand h1{margin:0;}
.brand .sub{margin:2px 0 0;}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.top h1{flex:1;margin:0;font-size:21px;}
.icon{min-width:44px;height:44px;border-radius:12px;background:var(--surface);font-size:20px;display:grid;place-items:center;padding:0 12px;}
.btn{min-height:48px;padding:0 18px;border-radius:12px;background:var(--surface2);font-weight:700;}
.btn.primary{background:var(--solo);color:var(--on-accent);}
.btn.danger{color:var(--danger);}
.btn.wide{width:100%;}
.row{display:flex;gap:10px;flex-wrap:wrap;}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:#FFFFFF;border-top:3px solid #C8102E;
  padding-bottom:env(safe-area-inset-bottom,0px);z-index:5;}
#tabs .in{display:flex;width:100%;max-width:560px;}
#tabs button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#4E6584;font-size:12px;font-weight:700;}
#tabs button[aria-current="page"]{color:#C8102E;}
#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}

/* cards */
.card{display:block;width:100%;text-align:left;background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid var(--line);}
.card .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;}
.card .name{font-size:19px;font-weight:800;}
.card .sport{font-size:13px;color:var(--muted);}
.mini{margin-top:10px;}
.mini .lbl{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px;gap:8px;}
.mini .lbl b{font-variant-numeric:tabular-nums;}
.bar{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;}
.bar i{display:block;height:100%;width:0;background:var(--c,var(--tabon));border-radius:6px;transition:width .25s;}

/* counter */
.side{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;margin-bottom:12px;}
.tap{width:100%;display:block;text-align:left;border-radius:14px;padding:14px 16px 16px;background:var(--surface2);border-left:8px solid var(--c);}
.tap:active{transform:scale(.985);filter:brightness(1.15);}
.tap .lab{font-size:17px;font-weight:800;color:var(--c);}
.tap .count{font-size:clamp(52px,19vw,88px);font-weight:900;line-height:1.02;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.tap .of{font-size:14px;color:var(--muted);margin-bottom:10px;}
.chips{display:flex;gap:8px;margin-top:10px;}
.chips button{flex:1;min-height:48px;border-radius:12px;background:var(--surface2);font-weight:800;font-size:17px;}
.chips button:active{filter:brightness(1.25);}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 12px;}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;}
.stat span{font-size:12px;color:var(--muted);}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:var(--solo);color:var(--on-accent);font-weight:800;padding:12px 20px;border-radius:999px;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:9;max-width:90vw;text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* forms */
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px;}
input[type=text],input[type=number],input[type=date],textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);user-select:text;-webkit-user-select:text;}
textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:12px;}
.pills{display:flex;flex-wrap:wrap;gap:8px;}
.pill{min-height:44px;padding:0 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;}
.pill[aria-pressed="true"]{background:var(--solo);color:var(--on-accent);border-color:var(--solo);}
.note{font-size:13px;color:var(--muted);margin:8px 0;}
.empty{text-align:center;padding:30px 10px;color:var(--muted);}
.orow{display:grid;grid-template-columns:1fr 112px 44px;gap:8px;margin-bottom:8px;align-items:center;}
.orow.m{grid-template-columns:1fr 100px 44px;}
.hdrs{display:grid;grid-template-columns:1fr 112px 44px;gap:8px;font-size:12px;color:var(--muted);margin-top:14px;}

/* calendar */
.month{display:flex;align-items:center;gap:8px;margin:8px 0 10px;}
.month h2{flex:1;margin:0;text-align:center;font-size:19px;}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.dow span{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding-bottom:2px;}
.cell{position:relative;aspect-ratio:1/1.08;border-radius:10px;background:var(--surface);border:1px solid var(--line);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;min-width:0;}
.cell .heat{position:absolute;inset:0;background:var(--heat);opacity:var(--h,0);}
.cell .d{position:relative;font-weight:800;font-size:15px;line-height:1.1;}
.cell .n{position:relative;font-size:10px;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--muted);min-height:11px;}
.cell.hi .d,.cell.hi .n{color:var(--hi);}
.cell.hi2 .d,.cell.hi2 .n{color:var(--hi2);}
.cell.today{outline:2px solid var(--tabon);outline-offset:-2px;}
.cell.blank{visibility:hidden;}
.cell:active{filter:brightness(1.2);}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:10px 0;}
.legend i{width:16px;height:12px;border-radius:3px;background:var(--heat);display:inline-block;}

/* day view */
.daynav{display:flex;gap:8px;margin-bottom:12px;}
.daynav .btn{flex:1;padding:0 8px;}
.dtotal{font-size:14px;color:var(--muted);margin:0 0 12px;}
.drow{margin-top:12px;}
.drow .dl{font-weight:800;color:var(--c);margin-bottom:6px;}
.dctl{display:grid;grid-template-columns:48px 48px minmax(0,1fr) 48px 48px;gap:6px;}
.dctl button{min-height:48px;border-radius:12px;background:var(--surface2);font-weight:800;}
.dctl button:active{filter:brightness(1.25);}
.dctl input{text-align:center;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 4px;}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 10px;margin-top:10px;}
.bars{display:flex;align-items:stretch;gap:2px;height:150px;border-bottom:1px solid var(--line);}
.bars.w{gap:8px;}
.col{flex:1;min-width:0;height:100%;}
.col .stack{display:flex;flex-direction:column-reverse;height:100%;}
.col .seg{display:block;width:100%;}
.col:first-child .seg:last-child{border-radius:3px 3px 0 0;}
.col:active{filter:brightness(1.3);}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;}
.key{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;margin-top:8px;}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px;}
.kv b{display:block;font-size:19px;font-variant-numeric:tabular-nums;}
.kv span{font-size:12px;color:var(--muted);}
.eta{font-size:14px;margin-top:10px;}
.eta div{margin-top:4px;}
.eta span{color:var(--muted);}
.tbars{display:flex;align-items:stretch;gap:6px;height:150px;border-bottom:1px solid var(--line);}
.tbars .grp{flex:1;min-width:0;display:flex;align-items:flex-end;gap:1px;height:100%;}
.tbars .tb{flex:1;min-width:0;border-radius:2px 2px 0 0;}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px;}
.linkbtn{color:var(--muted);font-size:13px;font-weight:700;min-height:44px;padding:0 4px;text-decoration:underline;}
.steps{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:14px;}
.steps li{margin-bottom:6px;}

/* fitness: sessions and time entry */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tgrid div{display:flex;align-items:center;gap:6px;min-width:0;}
.tgrid input{text-align:center;padding:10px 4px;min-width:0;}
.tgrid span{font-size:13px;color:var(--muted);}
.sform label:first-child{margin-top:4px;}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);}
.srow:first-of-type{border-top:0;}
.tiles.sm .stat b{font-size:17px;}
.tiles+.tiles{margin-top:8px;}
.card .tiles{margin-top:10px;}

/* badges */
.bgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center;opacity:.78;}
.badge.on{opacity:1;border-color:var(--tabon);}
.badge .bi{font-size:34px;line-height:1.15;filter:grayscale(1);}
.badge.on .bi{filter:none;}
.badge .bt{font-weight:800;font-size:14px;margin-top:4px;}
.badge .bd,.badge .bp{font-size:12px;color:var(--muted);margin-top:2px;}
.badge .bp{font-weight:700;}

/* games */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.fgrid.two{grid-template-columns:repeat(2,1fr);}
.fld{min-width:0;}
.fld label{margin:0 0 4px;font-size:12px;color:var(--muted);}
.fld input{padding:10px 6px;text-align:center;font-size:17px;font-weight:700;}
.rp{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;border:1px solid var(--line);white-space:nowrap;}
.rp.win{color:var(--good);border-color:var(--good);}
.rp.loss{color:var(--danger);border-color:var(--danger);}
.rp.draw{color:var(--muted);}
button.srow{cursor:pointer;color:var(--text);}

/* games2 */
.fwide{grid-column:1/-1;}
select{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;}
/* red accents */
h2::before{content:"";display:inline-block;width:4px;height:16px;background:var(--solo);border-radius:2px;margin-right:8px;vertical-align:-2px;}
.month h2::before{display:none;}
/* events */
input[type=time]{width:100%;min-height:48px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);user-select:text;-webkit-user-select:text;}
.rp.soon{color:var(--solo);border-color:var(--solo);}
.cell.ev::after{content:"";position:absolute;top:4px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--solo);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs" aria-label="Main">
  <div class="in">
    <button data-act="tab" data-tab="home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>Activities</button>
    <button data-act="tab" data-tab="games"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Games</button>
    <button data-act="tab" data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>Calendar</button>
    <button data-act="tab" data-tab="stats"><svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Stats</button>
    <button data-act="tab" data-tab="team"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.9.3 5 2.7 5 5.8"/></svg>Team</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var KEY="skilltally-v1";

/* ---------- presets: each activity has its own options and goal ---------- */
var FEET=[{l:"Left foot"},{l:"Right foot"}];
var HANDS=[{l:"Left hand"},{l:"Right hand"}];
var MM=[{l:"Made"},{l:"Missed",t:false}];
function one(l){return [{l:l}];}
function pr(n,sides,o){
  o=o||{};
  return {n:n,sides:sides,kind:o.kind||"count",unit:o.unit||"km",pace:o.pace||"perkm",period:o.period||"total",target:o.target===undefined?10000:o.target};
}
function cardio(n,unit,pace,target){return pr(n,[{l:"Distance"}],{kind:"cardio",unit:unit,pace:pace,period:"month",target:target});}
var SPORTS={
  "Rugby":[pr("Pass",[{l:"Left"},{l:"Right"}]),pr("Drop kick",FEET),pr("Box kick",FEET),pr("Goal kick",MM),pr("Grubber",FEET),pr("Line-out throw",one("Throws")),pr("Tackle",[{l:"Left shoulder"},{l:"Right shoulder"}])],
  "Fitness":[cardio("Run","km","perkm",100),cardio("Walk","km","perkm",100),cardio("Swim","m","per100m",5000),cardio("Cycle","km","kmh",200),
    pr("Push-ups",one("Push-ups"),{period:"day",target:50}),pr("Sit-ups",one("Sit-ups"),{period:"day",target:50}),
    pr("Pull-ups",one("Pull-ups"),{period:"day",target:10}),pr("Squats",one("Squats"),{period:"day",target:50})],
  "Football":[pr("Pass",FEET),pr("Shot",FEET),pr("Dribble",FEET),pr("Juggle",one("Juggles"))],
  "Basketball":[pr("Free throw",MM),pr("Layup",HANDS),pr("Three-pointer",MM)],
  "Cricket":[pr("Bowl",one("Balls")),pr("Catch",[{l:"Caught"},{l:"Dropped",t:false}]),pr("Bat drill",one("Shots"))],
  "Netball":[pr("Pass",HANDS),pr("Shot",MM)],
  "Hockey":[pr("Push pass",[{l:"Forehand"},{l:"Backhand"}]),pr("Shot",[{l:"Forehand"},{l:"Backhand"}])],
  "Other":[]
};
var PERIODS=[["total","Total"],["day","Per day"],["week","Per week"],["month","Per month"]];
var PERIOD_IDS=["total","day","week","month"];
var PACES=[["perkm","Min per km"],["per100m","Min per 100 m"],["kmh","Speed (km/h)"]];
var PACE_IDS=["perkm","per100m","kmh"];
var PALETTE=["var(--left)","var(--right)","var(--c2)","var(--c3)","var(--c4)","var(--c5)"];
var MAX_OPTS=6;

/* ---------- dates ---------- */
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function today(){return keyOf(new Date());}
function ymd(y,m,d){return y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");}
function parseKey(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(k,n){var d=parseKey(k);d.setDate(d.getDate()+n);return keyOf(d);}
function longDay(k){return parseKey(k).toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short",year:"numeric"});}
function shortDay(k){return parseKey(k).toLocaleDateString("en-NZ",{day:"numeric",month:"short"});}
function midDay(k){return parseKey(k).toLocaleDateString("en-NZ",{weekday:"short",day:"numeric",month:"short"});}
function validDate(k){return /^\d{4}-\d{2}-\d{2}$/.test(String(k||""));}

/* ---------- helpers ---------- */
function uid(){return Math.random().toString(36).slice(2,9);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(n){return Number(n).toLocaleString("en-NZ",{maximumFractionDigits:2});}
function fmtShort(n){
  n=Number(n)||0;
  if(n>=10000) return Math.round(n/1000)+"k";
  if(n>=1000) return (n/1000).toFixed(1).replace(".0","")+"k";
  if(n>=100) return String(Math.round(n));
  return String(Math.round(n*10)/10);
}
function pct(a,b){return b>0?Math.min(100,a/b*100):0;}
function round3(x){return Math.round(x*1000)/1000;}
function num(v){v=String(v||"").replace(",",".");var n=parseFloat(v);return isFinite(n)&&n>0?n:0;}

function seed(){
  return {skills:[{id:uid(),sport:"Rugby",name:"Pass",kind:"count",period:"total",
    sides:[{id:"a",label:"Left",target:10000},{id:"b",label:"Right",target:10000}],log:{}}]};
}
function load(){
  try{var raw=localStorage.getItem(KEY); if(raw){var d=JSON.parse(raw); if(d&&Array.isArray(d.skills)) return d;}}catch(e){}
  return seed();
}
var S=load();
function normalize(){
  if(!S.me||typeof S.me!=="object") S.me={id:uid(),name:""};
  if(!S.me.id) S.me.id=uid();
  if(!S.players||typeof S.players!=="object"||Array.isArray(S.players)) S.players={};
  if(S.sync&&(typeof S.sync!=="object"||!S.sync.url||!S.sync.code)) S.sync=null;
  if(!Array.isArray(S.goals)) S.goals=[];
  if(!Array.isArray(S.games)) S.games=[];
  if(!Array.isArray(S.events)) S.events=[];
}
normalize();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var badgeTimer=null;
function save(){persist();markDirty();clearTimeout(badgeTimer);badgeTimer=setTimeout(checkBadges,600);}
function byId(id){return S.skills.filter(function(s){return s.id===id;})[0];}
function skillLabel(sk){
  var dup=S.skills.filter(function(o){return o.name===sk.name;}).length>1;
  return dup?sk.name+" ("+sk.sport+")":sk.name;
}
function isCardio(sk){return sk.kind==="cardio";}
function unitSuffix(sk){return isCardio(sk)?" "+sk.unit:"";}
function periodLabel(per){return {total:"",day:" today",week:" this week",month:" this month"}[per||"total"]||"";}

/* ---------- data ---------- */
function dayVal(sk,date,sid){return ((sk.log[date]||{})[sid])||0;}
function dayTotal(sk,date){return sk.sides.reduce(function(a,s){return a+dayVal(sk,date,s.id);},0);}
function total(sk,sid){var t=0;for(var d in sk.log){t+=sk.log[d][sid]||0;}return t;}
function allTotal(sk){return sk.sides.reduce(function(a,s){return a+total(sk,s.id);},0);}
function allToday(sk){return dayTotal(sk,today());}
function todayLine(sk){return fmt(allToday(sk))+unitSuffix(sk);}
function activeDays(sk){return Object.keys(sk.log).filter(function(d){return dayTotal(sk,d)>0;});}
function activeSet(skills,games){var set={}; skills.forEach(function(sk){activeDays(sk).forEach(function(d){set[d]=1;});}); (games||[]).forEach(function(g){if(g&&validDate(g.date)) set[g.date]=1;}); return set;}
function currentStreak(set){
  var k=today(); if(!set[k]) k=addDays(k,-1);
  var c=0; while(set[k]){c++;k=addDays(k,-1);} return c;
}
function longestStreak(set){
  var keys=Object.keys(set).sort(), best=0, run=0, prev=null;
  keys.forEach(function(k){ run=(prev&&addDays(prev,1)===k)?run+1:1; if(run>best) best=run; prev=k; });
  return best;
}
function activeDaysLast(set,n){var c=0,tk=today();for(var i=0;i<n;i++){if(set[addDays(tk,-i)]) c++;}return c;}
function recentPace(sk,sid,n){var t=0,k=today();for(var i=0;i<n;i++){t+=dayVal(sk,addDays(k,-i),sid);}return t/n;}
function sumDays(sk,n){var t=0,k=today();for(var i=0;i<n;i++){t+=dayTotal(sk,addDays(k,-i));}return t;}
function bestDay(sk){
  var best=0, when=null;
  Object.keys(sk.log).forEach(function(d){var t=dayTotal(sk,d); if(t>best){best=t;when=d;}});
  return {n:best,date:when};
}
/* dates in the current goal period, up to today. null = all time */
function periodKeys(period){
  var tk=today(), keys=[], i, d;
  if(period==="day") return [tk];
  if(period==="week"){d=parseKey(tk); var off=(d.getDay()+6)%7; for(i=0;i<=off;i++) keys.push(addDays(tk,-i)); return keys;}
  if(period==="month"){d=parseKey(tk); for(i=0;i<d.getDate();i++) keys.push(addDays(tk,-i)); return keys;}
  return null;
}
function progress(sk,sid){
  var per=sk.period||"total";
  if(per==="total") return total(sk,sid);
  return periodKeys(per).reduce(function(a,k){return a+dayVal(sk,k,sid);},0);
}
function repsTotal(skills){return skills.reduce(function(a,sk){return a+(isCardio(sk)?0:allTotal(sk));},0);}
function kmTotal(skills){return skills.reduce(function(a,sk){return a+(isCardio(sk)?toKm(sk,allTotal(sk)):0);},0);}
/* days until every total-goal is met, at the last 14 days' pace. null = no estimate, 0 = done */
function etaDays(sk){
  if((sk.period||"total")!=="total") return null;
  var worst=0, has=false;
  for(var i=0;i<sk.sides.length;i++){
    var s=sk.sides[i]; if(!(s.target>0)) continue; has=true;
    var left=s.target-total(sk,s.id); if(left<=0) continue;
    var pace=recentPace(sk,s.id,14); if(pace<=0) return null;
    worst=Math.max(worst,Math.ceil(left/pace));
  }
  return has?worst:null;
}
function accuracy(sk){
  var made=null, missed=null;
  sk.sides.forEach(function(s){
    if(/^(made|caught)$/i.test(s.label)) made=s;
    if(/^(missed|dropped)$/i.test(s.label)) missed=s;
  });
  if(!made||!missed) return null;
  var a=total(sk,made.id), b=total(sk,missed.id);
  return (a+b)>0?Math.round(a/(a+b)*100):null;
}
function sideColor(sk,i){
  var l=sk.sides[i].label;
  if(/^(made|caught)$/i.test(l)) return "var(--good)";
  if(/^(missed|dropped)$/i.test(l)) return "var(--danger)";
  if(sk.sides.length===1) return "var(--tabon)";
  return PALETTE[i%PALETTE.length];
}

/* ---------- distance and time ---------- */
function toKm(sk,d){return sk.unit==="m"?d/1000:d;}
function mmss(m){var s=Math.round(m*60);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}
function paceStr(sk,dist,mins){
  if(!(dist>0)||!(mins>0)) return "–";
  var km=toKm(sk,dist), p=sk.pace||"perkm";
  if(p==="kmh") return (Math.round(km/(mins/60)*10)/10)+" km/h";
  if(p==="per100m") return mmss(mins/(km*10))+" /100m";
  return mmss(mins/km)+" /km";
}
function fmtDur(mins){
  if(!(mins>0)) return "–";
  var s=Math.round(mins*60), h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60;
  return h>0?h+"h "+String(m).padStart(2,"0")+"m":m+"m "+String(sec).padStart(2,"0")+"s";
}
function speed(sk,x){return x.t>0?toKm(sk,x.d)/(x.t/60):0;}
function recomputeDay(sk,date){
  var d=0,t=0;
  (sk.sessions||[]).forEach(function(x){if(x.date===date){d+=x.d;t+=x.t;}});
  if(d<=0&&t<=0) delete sk.log[date]; else sk.log[date]={d:round3(d),t:round3(t)};
}
function addSession(sk,date,dist,mins,note,effort){
  sk.sessions=sk.sessions||[];
  sk.sessions.push({id:uid(),date:date,d:round3(dist),t:round3(mins),note:note||"",effort:effort||0});
  recomputeDay(sk,date); save();
}
function updateSession(sk,id,date,dist,mins,note,effort){
  var x=(sk.sessions||[]).filter(function(y){return y.id===id;})[0]; if(!x) return;
  var oldDate=x.date;
  x.date=date; x.d=round3(dist); x.t=round3(mins); x.note=note||""; x.effort=effort||0;
  recomputeDay(sk,oldDate); if(oldDate!==date) recomputeDay(sk,date);
  save();
}
function removeSession(sk,id){
  var s=(sk.sessions||[]).filter(function(x){return x.id===id;})[0]; if(!s) return;
  sk.sessions=sk.sessions.filter(function(x){return x.id!==id;});
  recomputeDay(sk,s.date); save();
}

/* ---------- changing counts ---------- */
var undoStack=[];
function add(sk,sid,n,date){
  date=date||today();
  var curT=total(sk,sid), nextT=Math.max(0,curT+n), applied=nextT-curT;
  if(applied===0) return;
  var side=sk.sides.filter(function(s){return s.id===sid;})[0], before=progress(sk,sid);
  sk.log[date]=sk.log[date]||{};
  sk.log[date][sid]=Math.max(0,(sk.log[date][sid]||0)+applied);
  undoStack.push({skill:sk.id,side:sid,n:applied,date:date}); if(undoStack.length>50) undoStack.shift();
  save();
  var after=progress(sk,sid);
  if(applied>0 && side.target>0 && before<side.target && after>=side.target){
    toast("Goal reached: "+fmt(side.target)+" "+side.label.toLowerCase()+periodLabel(sk.period)+"!"); buzz([60,40,60,40,120]);
  } else if(applied>0 && (sk.period||"total")==="total" && Math.floor(nextT/1000)>Math.floor(curT/1000)){
    toast(fmt(Math.floor(nextT/1000)*1000)+" "+side.label.toLowerCase()+"! Keep going."); buzz([30,40,30]);
  } else buzz(8);
}
function setDay(sk,date,sid,value){
  sk.log[date]=sk.log[date]||{};
  sk.log[date][sid]=Math.max(0,value);
  save();
}
function undo(){
  var u=undoStack.pop(); if(!u){toast("Nothing to undo");return;}
  var sk=byId(u.skill); if(!sk||!sk.log[u.date]) return;
  sk.log[u.date][u.side]=Math.max(0,(sk.log[u.date][u.side]||0)-u.n);
  save(); refreshCounter();
}
function buzz(p){try{if(navigator.vibrate) navigator.vibrate(p);}catch(e){}}

function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show");},2400);}

    if(s.target>0) parts.push("of "+fmt(s.target)+periodLabel(per)+" · "+Math.round(pct(pv,s.target))+"%");
    if(per!=="day") parts.push("today "+fmt(dayVal(sk,today(),s.id)));
    if(per!=="total") parts.push("all-time "+fmt(tv));
    var c=app.querySelector('[data-count="'+s.id+'"]'); if(c) c.textContent=fmt(pv);
    var o=app.querySelector('[data-of="'+s.id+'"]'); if(o) o.textContent=parts.join(" · ");
    var b=app.querySelector('[data-bar="'+s.id+'"]'); if(b) b.style.width=pct(pv,s.target)+"%";
  });
  function put(k,v){var e=app.querySelector('[data-stat="'+k+'"]'); if(e) e.textContent=v;}
  put("today",fmt(allToday(sk)));
  put("streak",currentStreak(activeSet([sk])));
  var acc=accuracy(sk), eta=etaDays(sk);
  if(acc!==null){ put("third",acc+"%"); put("thirdlbl","accuracy"); }
  else if(eta!==null){ put("third",eta===0?"Done!":fmt(eta)); put("thirdlbl","days left at recent pace"); }
  else { put("third",fmt(sumDays(sk,periodKeys("week").length))); put("thirdlbl","this week"); }
}

/* ---------- calendar ---------- */
function dots(n){var s="";for(var i=0;i<Math.min(n,4);i++) s+="•";return s;}
function renderCal(){
  if(calFilter!=="all"&&!byId(calFilter)) calFilter="all";
  var skills=pickSkills(calFilter), single=(calFilter!=="all"&&skills.length===1)?skills[0]:null;
  var y=calMonth.y, m=calMonth.m;
  var first=new Date(y,m,1), n=new Date(y,m+1,0).getDate(), off=(first.getDay()+6)%7, tk=today();
  var vals={}, max=0, monthSum=0, activeCount=0, best=0, bestKey=null, d;
  for(d=1;d<=n;d++){
    var k=ymd(y,m,d);
    var v=single?dayTotal(single,k):skills.filter(function(sk){return dayTotal(sk,k)>0;}).length+S.games.filter(function(g){return g.date===k;}).length;
    vals[k]=v; if(v>max) max=v; monthSum+=v; if(v>0) activeCount++; if(v>best){best=v;bestKey=k;}
  }
  var denom=single?max:Math.max(1,skills.length), suf=single?unitSuffix(single):"";
  var nowM=new Date(), isCurrentOrFuture=(y>nowM.getFullYear())||(y===nowM.getFullYear()&&m>=nowM.getMonth());

  h+='<div class="month"><button class="icon" data-act="mprev" aria-label="Previous month">‹</button><h2>'+first.toLocaleDateString("en-NZ",{month:"long",year:"numeric"})+'</h2><button class="icon" data-act="mnext" aria-label="Next month"'+(isCurrentOrFuture?' disabled':'')+'>›</button></div>';
  h+='<div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div><div class="grid">';
  for(var i=0;i<off;i++) h+='<div class="cell blank"></div>';
  for(d=1;d<=n;d++){
    var key=ymd(y,m,d), val=vals[key], lvl=0;
    if(val>0&&denom>0){ var r=val/denom; lvl=r>0.75?5:r>0.5?4:r>0.25?3:r>0.1?2:1; }
    var op=[0,0.16,0.32,0.5,0.72,0.95][lvl], future=key>tk, hasEv=S.events.some(function(e){return e.date===key;});
    var label=single?fmt(val)+suf:val+(val===1?" activity":" activities");
    h+='<button class="cell'+(lvl>=3?' hi':'')+(lvl>=5?' hi2':'')+(key===tk?' today':'')+(hasEv?' ev':'')+'" data-act="day" data-date="'+key+'"'+(future?' disabled':'')+' aria-label="'+longDay(key)+': '+label+'">'
      +'<span class="heat" style="--h:'+op+'"></span><span class="d">'+d+'</span><span class="n">'+(val>0?(single?fmtShort(val):dots(val)):'')+'</span></button>';
  }
  h+='</div>';
  h+='<div class="legend">Less <i style="opacity:.2"></i><i style="opacity:.5"></i><i style="opacity:.95"></i> More</div>';
  h+='<div class="tiles">'
    +tile(single?fmt(monthSum)+suf:monthSum,single?'this month':'activities logged')
    +tile(activeCount,'active days')
    +tile(single?fmtShort(best)+suf:best,'best day'+(bestKey?' ('+shortDay(bestKey)+')':''))+'</div>';
  app.innerHTML=h;
}

function chartHtml(sk){

  }

    var s=g.stats||{}, e=athEv(s.event); if(g.sport!=="Athletics"||!e||!(s.mark>0)) return;
    var b=best[e[0]];
    if(!b||(e[2]==="time"?s.mark<b.mark:s.mark>b.mark)) best[e[0]]={mark:s.mark,date:g.date,e:e};
  });
  var rows=ATH_EVENTS.filter(function(e){return best[e[0]];});
  if(!rows.length) return "";
  var h='<h2>Personal bests</h2><div class="card">';
  rows.forEach(function(e){
    var b=best[e[0]];
    h+='<div class="srow"><div><b>'+esc(e[1])+'</b><div class="note" style="margin:2px 0 0">'+longDay(b.date)+'</div></div><b>'+esc(fmtMarkVal(b.e,b.mark))+'</b></div>';
  });
  return h+'</div>';
}
function cricketTiles(games){
  var inn=0,runs=0,balls=0,out=0,hs=-1,hsNo=false,f=0,h=0,bb=0,conc=0,wk=0,catches=0,best=null,bowled=false;
  games.forEach(function(g){
    var s=g.stats||{};
    if(s.howOut&&s.howOut!=="dnb"){
      inn++; var r=s.runs||0; runs+=r; balls+=s.balls||0; if(s.howOut!=="notout") out++;
      if(r>hs){hs=r;hsNo=s.howOut==="notout";} if(r>=100) h++; else if(r>=50) f++;
    }
    if(s.overs>0){ bowled=true; bb+=oversToBalls(s.overs); conc+=s.conc||0; wk+=s.wkts||0;
      if(!best||(s.wkts||0)>best.w||((s.wkts||0)===best.w&&(s.conc||0)<best.c)) best={w:s.wkts||0,c:s.conc||0}; }
    catches+=s.catches||0;
  });
  var t=[];
  if(inn>0){
    t.push([inn,"innings"],[runs,"runs"],[hs+(hsNo?"*":""),"high score"],[out>0?(runs/out).toFixed(1):"–","batting average"]);
    if(balls>0) t.push([(runs/balls*100).toFixed(1),"strike rate"]);
    if(f+h>0) t.push([f+"/"+h,"50s / 100s"]);
  }
  if(bowled){
    t.push([wk,"wickets"],[best.w+"/"+best.c,"best bowling"],[ballsToOvers(bb),"overs bowled"]);
    if(bb>0) t.push([(conc/(bb/6)).toFixed(2),"economy"]);
    if(wk>0) t.push([(conc/wk).toFixed(1),"bowling average"]);
  }
  if(catches>0) t.push([catches,"catches"]);
  return t;
}
function rugbyTiles(games){
  var s={tries:0,conv:0,pens:0,drops:0,tackles:0,missed:0,carries:0,mins:0};
  games.forEach(function(g){var x=g.stats||{}; Object.keys(s).forEach(function(k){s[k]+=x[k]||0;});});
  var pts=s.tries*5+s.conv*2+s.pens*3+s.drops*3, t=[];
  if(s.tries>0) t.push([s.tries,"tries"]);
  if(pts>0) t.push([pts,"points scored"]);
  if(s.tackles>0) t.push([s.tackles,"tackles made"]);
  if(s.tackles+s.missed>0) t.push([Math.round(s.tackles/(s.tackles+s.missed)*100)+"%","tackle success"]);
  if(s.carries>0) t.push([s.carries,"carries"]);
  if(s.mins>0) t.push([s.mins,"minutes played"]);
  return t;
}

var seasonKind="year", seasonYear=null, seasonWho="";
function leapYear(y){return (y%4===0&&y%100!==0)||y%400===0;}
function seasonRange(kind,y){
  if(kind==="winter") return {from:y+"-03-01",to:y+"-08-31",label:"Winter "+y+" (Mar–Aug)"};
  if(kind==="summer") return {from:y+"-09-01",to:(y+1)+"-02-"+(leapYear(y+1)?"29":"28"),label:"Summer "+y+"/"+String(y+1).slice(2)+" (Sep–Feb)"};
  if(kind==="year") return {from:y+"-01-01",to:y+"-12-31",label:String(y)};
  return {from:"0000-01-01",to:"9999-12-31",label:"All time"};
}
function defaultYear(kind){
  var d=new Date(), y=d.getFullYear(), m=d.getMonth()+1;
  if(kind==="winter") return m>=3?y:y-1;
  if(kind==="summer") return m>=9?y:y-1;
  return y;
}
function inRange(d,r){return d>=r.from&&d<=r.to;}
function seasonSkill(sk,r){
  var log={}; Object.keys(sk.log).forEach(function(d){if(inRange(d,r)) log[d]=sk.log[d];});
  var c=Object.assign({},sk,{log:log});
  if(sk.sessions) c.sessions=sk.sessions.filter(function(x){return inRange(x.date,r);});
  return c;
}
function seasonData(p,r){

function seasonMetrics(d){
  var set=activeSet(d.skills,d.games), mins=0, w=0, l=0, dr=0;
  d.skills.forEach(function(sk){if(isCardio(sk)) mins+=total(sk,"t");});
  d.games.forEach(function(g){ if(g.result==="win") w++; else if(g.result==="loss") l++; else if(g.result==="draw") dr++; });
  return {days:Object.keys(set).length,streak:longestStreak(set),km:kmTotal(d.skills),reps:repsTotal(d.skills),mins:mins,games:d.games.length,w:w,l:l,d:dr};
}
function seasonHighlights(d,m){
  var out=[], longest=null, fastest=null;
  if(m.streak>1) out.push("Best streak: "+m.streak+" days in a row");
  d.skills.forEach(function(sk){
    if(isCardio(sk)){
      (sk.sessions||[]).forEach(function(x){
        if(!longest||toKm(sk,x.d)>toKm(longest.sk,longest.x.d)) longest={sk:sk,x:x};
        if((sk.pace||"perkm")==="perkm"&&x.t>0&&toKm(sk,x.d)>=1){ var sp=speed(sk,x); if(!fastest||sp>fastest.sp) fastest={sk:sk,x:x,sp:sp}; }
      });
    } else { var bd=bestDay(sk); if(bd.n>0) out.push(sk.name+" best day: "+fmt(bd.n)+" ("+shortDay(bd.date)+")"); }
  });
  if(longest) out.unshift("Longest session: "+fmt(longest.x.d)+" "+longest.sk.unit+" ("+longest.sk.name+", "+shortDay(longest.x.date)+")");
  if(fastest) out.splice(1,0,"Fastest pace: "+paceStr(fastest.sk,fastest.x.d,fastest.x.t)+" ("+fastest.sk.name+")");
  return out;
}

var recordsWho="";
function weekStart(d){var dt=parseKey(d);return addDays(d,-((dt.getDay()+6)%7));}
function streakInfo(set){
  var keys=Object.keys(set).sort(), best=0, run=0, prev=null, end=null;
  keys.forEach(function(k){ run=(prev&&addDays(prev,1)===k)?run+1:1; if(run>best){best=run;end=k;} prev=k; });
  return {n:best,end:end};
}
function bestGame(gs,fn,high){
  var b=null;
  gs.forEach(function(g){ var v=fn(g); if(v===null||v===undefined) return; if(!b||(high?v>b.v:v<b.v)) b={g:g,v:v}; });
  return b;
}
var RECORD_STATS={
  "Touch":[["tries","Most tries in a game"],["assists","Most assists in a game"]],
  "Football":[["goals","Most goals in a game"],["assists","Most assists in a game"]],
  "Hockey":[["goals","Most goals in a game"],["assists","Most assists in a game"]],
  "Netball":[["goals","Most goals in a game"]],
  "Basketball":[["pts","Most points in a game"],["reb","Most rebounds in a game"],["ast","Most assists in a game"]]
};
function recordsFor(p){
  var recs=[];
  function add(id,cat,label,val,text,date,high){recs.push({id:id,cat:cat,label:label,val:val,text:text,date:date,high:high});}
  var st=streakInfo(activeSet(p.skills,p.games)); if(st.n>1) add("streak","Overall","Longest streak",st.n,st.n+" days",st.end,true);
  p.skills.forEach(function(sk){
    var key=skKey(sk), cat=sk.name, wk={};
    if(isCardio(sk)){
      var sess=sk.sessions||[]; if(!sess.length) return;
      var lg=null; sess.forEach(function(x){ if(!lg||toKm(sk,x.d)>toKm(sk,lg.d)) lg=x; });
      add(key+":long",cat,"Longest session",toKm(sk,lg.d),fmt(lg.d)+" "+sk.unit,lg.date,true);
      var pt=sk.pace||"perkm", thr=pt==="kmh"?[10,25]:(pt==="per100m"?[0.4,1]:[1,5,10]);
      thr.forEach(function(t){
        var best=null; sess.forEach(function(x){ if(x.t>0&&toKm(sk,x.d)>=t){ var sp=speed(sk,x); if(!best||sp>best.sp) best={x:x,sp:sp}; } });
        if(!best) return;
        var val=pt==="kmh"?best.sp:(pt==="per100m"?best.x.t/(toKm(sk,best.x.d)*10):best.x.t/toKm(sk,best.x.d));
        add(key+":pace"+t,cat,"Fastest pace, "+(t<1?(t*1000)+" m":t+" km")+" or more",val,paceStr(sk,best.x.d,best.x.t)+" ("+fmt(best.x.d)+" "+sk.unit+")",best.x.date,pt==="kmh");
      });
      Object.keys(sk.log).forEach(function(d){var v=sk.log[d].d||0; if(v>0){var w=weekStart(d); wk[w]=(wk[w]||0)+v;}});
      var bw=null; Object.keys(wk).forEach(function(w){ if(!bw||wk[w]>bw.v) bw={w:w,v:wk[w]}; });
      if(bw) add(key+":week",cat,"Biggest week",toKm(sk,bw.v),fmt(round2(bw.v))+" "+sk.unit,bw.w,true);
    } else {
      var acc=accuracy(sk)!==null, use=acc?sk.sides.filter(function(s){return /^(made|caught)$/i.test(s.label);}):sk.sides;
      if(!use.length) return;
      var bd=null;
      Object.keys(sk.log).forEach(function(d){
        var v=use.reduce(function(a,s){return a+dayVal(sk,d,s.id);},0);
        if(v>0){ if(!bd||v>bd.v) bd={d:d,v:v}; var w=weekStart(d); wk[w]=(wk[w]||0)+v; }
      });
      var word=acc?use[0].label.toLowerCase():"";
      if(bd) add(key+":day",cat,acc?"Most "+word+" in a day":"Best day",bd.v,fmt(bd.v),bd.d,true);
      var bw2=null; Object.keys(wk).forEach(function(w){ if(!bw2||wk[w]>bw2.v) bw2={w:w,v:wk[w]}; });
      if(bw2) add(key+":week",cat,acc?"Most "+word+" in a week":"Best week",bw2.v,fmt(bw2.v),bw2.w,true);
    }
  });
  var by={}; (p.games||[]).forEach(function(g){(by[g.sport]=by[g.sport]||[]).push(g);});
  Object.keys(by).forEach(function(sp){
    var gs=by[sp], b;
    function stat(k){return function(g){var v=(g.stats||{})[k]; return v>0?v:null;};}
    if(sp==="Cricket"){
      b=bestGame(gs,function(g){var s=g.stats||{}; return (s.howOut&&s.howOut!=="dnb")?(s.runs||0):null;},true);
      if(b&&b.v>0) add("Cricket:hs","Cricket","Highest score",b.v,b.v+(b.g.stats.howOut==="notout"?"*":""),b.g.date,true);
      b=bestGame(gs,function(g){var s=g.stats||{}; return s.overs>0?(s.wkts||0)*1000-(s.conc||0):null;},true);
      if(b) add("Cricket:bb","Cricket","Best bowling",b.v,(b.g.stats.wkts||0)+"/"+(b.g.stats.conc||0),b.g.date,true);
      b=bestGame(gs,stat("sixes"),true); if(b) add("Cricket:six","Cricket","Most sixes in an innings",b.v,String(b.v),b.g.date,true);
      b=bestGame(gs,stat("catches"),true); if(b) add("Cricket:catch","Cricket","Most catches in a game",b.v,String(b.v),b.g.date,true);
    } else if(sp==="Rugby"){
      b=bestGame(gs,stat("tries"),true); if(b) add("Rugby:tries","Rugby","Most tries in a game",b.v,String(b.v),b.g.date,true);
      b=bestGame(gs,stat("tackles"),true); if(b) add("Rugby:tackles","Rugby","Most tackles in a game",b.v,String(b.v),b.g.date,true);
      b=bestGame(gs,function(g){var s=g.stats||{}; var v=(s.tries||0)*5+(s.conv||0)*2+(s.pens||0)*3+(s.drops||0)*3; return v>0?v:null;},true);
      if(b) add("Rugby:pts","Rugby","Most points in a game",b.v,String(b.v),b.g.date,true);
    } else if(sp==="Cross country"){
      b=bestGame(gs,stat("place"),false); if(b) add("XC:place","Cross country","Best place",b.v,ord(b.v)+(b.g.stats.runners>0?" of "+b.g.stats.runners:""),b.g.date,false);
      b=bestGame(gs,stat("dist"),true); if(b) add("XC:long","Cross country","Longest race",b.v,fmt(b.v)+" km",b.g.date,true);
    } else if(sp==="Athletics"){
      ATH_EVENTS.forEach(function(e){
        var time=e[2]==="time", eb=bestGame(gs,function(g){var s=g.stats||{}; return (s.event===e[0]&&s.mark>0)?s.mark:null;},!time);
        if(eb) add("ATH:"+e[0],"Athletics","Best "+e[1],eb.v,fmtMarkVal(e,eb.v),eb.g.date,!time);

      RECORD_STATS[sp].forEach(function(rs){ var rb=bestGame(gs,stat(rs[0]),true); if(rb) add(sp+":"+rs[0],sp,rs[1],rb.v,String(rb.v),rb.g.date,true); });
    }
  });
  return recs;
}
function familyRecords(players){
  var best={}, order=[];
  players.forEach(function(p,i){
    recordsFor(p).forEach(function(r){
      var cur=best[r.id];
      if(!cur){order.push(r.id); best[r.id]={r:r,i:i};}

    });
  });
  return {order:order,best:best};
}

function badgeStats(skills,games){
  games=games||[];
  var set=activeSet(skills,games), weeks={}, longest=0, goals=0;
  skills.forEach(function(sk){
    activeDays(sk).forEach(function(d){
      var dt=parseKey(d), wk=addDays(d,-((dt.getDay()+6)%7));
      var w=weeks[wk]||(weeks[wk]={days:{},acts:{}});
      w.days[d]=1; w.acts[sk.id]=1;
    });
    if(isCardio(sk)&&(sk.pace||"perkm")==="perkm"){
      (sk.sessions||[]).forEach(function(x){var k=toKm(sk,x.d); if(k>longest) longest=k;});
    }
    if((sk.period||"total")==="total"){
      sk.sides.forEach(function(sd){ if(sd.target>0&&total(sk,sd.id)>=sd.target) goals++; });
    }
  });
  var bestRuns=0,bestWkts=0,bestTries=0,podiums=0,raceWins=0;
  games.forEach(function(g){
    var st=g.stats||{}, dt=parseKey(g.date), wk=addDays(g.date,-((dt.getDay()+6)%7));
    var w=weeks[wk]||(weeks[wk]={days:{},acts:{}}); w.days[g.date]=1; w.acts["g_"+g.sport]=1;
    if(st.howOut&&st.howOut!=="dnb"&&(st.runs||0)>bestRuns) bestRuns=st.runs;
    if((st.wkts||0)>bestWkts) bestWkts=st.wkts;
    if((st.tries||0)>bestTries) bestTries=st.tries;
    if(gmode(g.sport)!=="match"&&st.place>=1){ if(st.place<=3) podiums++; if(st.place===1) raceWins++; }
  });
  var wd=0, wv=0;
  Object.keys(weeks).forEach(function(k){
    wd=Math.max(wd,Object.keys(weeks[k].days).length);
    wv=Math.max(wv,Object.keys(weeks[k].acts).length);
  });
  return {days:Object.keys(set).length,streak:longestStreak(set),reps:repsTotal(skills),km:kmTotal(skills),longest:longest,weekdays:wd,variety:wv,goals:goals,games:games.length,bestRuns:bestRuns,bestWkts:bestWkts,bestTries:bestTries,pbs:Object.keys(pbSet(games)).length,podiums:podiums,raceWins:raceWins};
}

function keysFor(period){
  if(period==="year"){
    var tk=today(), t=parseKey(tk), n=Math.floor((t-new Date(t.getFullYear(),0,1))/86400000)+1, keys=[];
    for(var i=0;i<n;i++) keys.push(addDays(tk,-i));
    return keys;
  }
  return periodKeys(period);
}
function daysLeft(period){
  var t=parseKey(today());
  if(period==="week") return 6-((t.getDay()+6)%7);
  if(period==="month") return new Date(t.getFullYear(),t.getMonth()+1,0).getDate()-t.getDate();
  return Math.round((new Date(t.getFullYear(),11,31)-t)/86400000);
}
function cleanGoals(arr){
  var out=[];
  (Array.isArray(arr)?arr:[]).slice(0,20).forEach(function(g){
    if(!g||typeof g!=="object") return;
    var t=parseFloat(g.target); if(!(t>0)||!isFinite(t)||t>10000000) return;
    out.push({id:String(g.id||uid()).replace(/[^A-Za-z0-9]/g,"").slice(0,20)||uid(),metric:String(g.metric||"days").slice(0,100),
      period:["week","month","year"].indexOf(g.period)>=0?g.period:"week",mode:g.mode==="together"?"together":"each",target:t,name:String(g.name||"").slice(0,40)});
  });
  return out;
}
function goalInfo(g,keys){
  if(g.metric==="days") return {name:"active days",unit:" days",days:true};
  var k=keys.filter(function(x){return x.key===g.metric;})[0];
  return {name:k?k.name:String(g.metric).split("|")[1]||"activity",unit:k?k.unit:"",days:false};
}
function goalTitle(g,info){
  if(g.name) return g.name;
  var per={week:"this week",month:"this month",year:"this year"}[g.period];
  var what=info.days?fmt(g.target)+" active days":info.name+" "+fmt(g.target)+info.unit;
  return g.mode==="together"?what+" together "+per:"Everyone: "+what+" "+per;
}

  if(m==="bad_code") return "The family code doesn't match the one in your script.";
  if(m==="set_code") return "Change the family code inside the script first.";
  if(m==="bad_reply") return "Couldn't read the reply. Check the web app is set to share with Anyone.";
  if(/Failed to fetch|NetworkError|Load failed|TypeError/i.test(m)) return "Couldn't reach the sheet. Check your connection and the address.";
  return "Sync problem: "+m.slice(0,80);
}
function rawCall(url,code,action,extra,keep){
  var body=JSON.stringify(Object.assign({action:action,code:code},extra||{}));
  return fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:body,keepalive:!!keep&&body.length<60000})
    .then(function(r){return r.text();})
    .then(function(t){try{return JSON.parse(t);}catch(e){throw new Error("bad_reply");}});
}
function logRows(skills,games){
  var rows=[];
  skills.forEach(function(sk){
    if(isCardio(sk)){
      (sk.sessions||[]).forEach(function(x){rows.push([x.date,sk.sport,sk.name,"Session",x.d,sk.unit,round3(x.t)]);});
    } else {
      Object.keys(sk.log).sort().forEach(function(d){
        sk.sides.forEach(function(s){var v=sk.log[d][s.id]; if(v>0) rows.push([d,sk.sport,sk.name,s.label,v,"reps",""]);});
      });
    }
  });
  return rows.concat(gameRows(games||[])).slice(0,20000);
}
function markDirty(){
  if(!syncMember()) return;
  sync.ver++; S.sync.dirty=true; persist();
  clearTimeout(sync.timer); sync.timer=setTimeout(syncFlush,4000);
}
function syncFlush(keep){
  clearTimeout(sync.timer);
  if(!syncMember()||!S.sync.dirty||sync.busy) return Promise.resolve();
  sync.busy=true;
  var ver=sync.ver, data=JSON.stringify({skills:S.skills,games:S.games});
  return rawCall(S.sync.url,S.sync.code,"push",{id:S.me.id,name:shareName()||"Player",data:data,rows:logRows(S.skills,S.games)},keep===true)
    .then(function(res){
      sync.busy=false;
      if(!res.ok) throw new Error(res.error||"failed");
      sync.err=""; S.sync.pushedAt=Date.now();
      if(sync.ver===ver) S.sync.dirty=false; else { clearTimeout(sync.timer); sync.timer=setTimeout(syncFlush,2000); }
      persist();
    })
    .catch(function(e){ sync.busy=false; sync.err=friendlyErr(e); clearTimeout(sync.timer); sync.timer=setTimeout(syncFlush,30000); })
    .then(function(){ if(view.name==="team") renderTeam(); });
}
function applyFamily(list){
  sync.raw=list;
  var before=JSON.stringify([S.players,S.goals,S.familyName,S.events]), seen={};
  list.forEach(function(p){
    if(p&&p.id==="familygoals"){
      if(!S.goalsDirty){ try{var go=JSON.parse(p.data); if(go&&Array.isArray(go.goals)) S.goals=cleanGoals(go.goals); if(go&&typeof go.family==="string") S.familyName=go.family.slice(0,30); if(go&&Array.isArray(go.events)) S.events=cleanEvents(go.events);}catch(e){} }
      return;
    }
    if(!p||!/^[A-Za-z0-9]{3,20}$/.test(String(p.id))||p.id===S.me.id) return;
    var obj; try{obj=JSON.parse(p.data);}catch(e){return;}
    if(!obj||!Array.isArray(obj.skills)) return;
    seen[p.id]=1;
    S.players[p.id]={id:p.id,name:String(p.name||"Player").slice(0,30),skills:cleanSkills(obj.skills),games:cleanGames(obj.games),at:p.at||0,via:"sync"};
  });
  Object.keys(S.players).forEach(function(id){ if(S.players[id].via==="sync"&&!seen[id]) delete S.players[id]; });
  return before!==JSON.stringify([S.players,S.goals,S.familyName,S.events]);
}
function syncPull(force){
  if(!syncOn()) return Promise.resolve();
  if(sync.pulling) return Promise.resolve();
  sync.pulling=true;
  return rawCall(S.sync.url,S.sync.code,"pull",{})
    .then(function(res){
      sync.pulling=false;
      if(!res.ok) throw new Error(res.error||"failed");
      var changed=applyFamily(res.players||[]);
      sync.err=""; S.sync.pulledAt=Date.now(); persist();
      if(S.goalsDirty||(S.goals.length&&!(res.players||[]).some(function(p){return p.id==="familygoals";}))) pushGoals();
      if(view.name==="team"&&(changed||force||sync.errShown)){ sync.errShown=false; renderTeam(); }
    })
    .catch(function(e){ sync.pulling=false; sync.err=friendlyErr(e); sync.errShown=true; if(view.name==="team") renderTeam(); });
}
function agoText(ms){
  if(!ms) return "never";
  var m=Math.round((Date.now()-ms)/60000);
  if(m<1) return "just now";
  if(m<60) return m+" min ago";
  var h=Math.round(m/60);
  if(h<24) return h+" h ago";
  return shortDay(keyOf(new Date(ms)));
}

function adoptPlayer(id){
  var p=(sync.raw||[]).filter(function(x){return x.id===id;})[0]; if(!p) return;
  if(id!==S.me.id){
    var obj=null; try{obj=JSON.parse(p.data);}catch(e){}
    var skills=(obj&&Array.isArray(obj.skills))?cleanSkills(obj.skills):[];
    S.skills=skills.length?skills:seed().skills;
    S.games=cleanGames(obj&&obj.games);
    S.me={id:id,name:String(p.name||"").slice(0,30)};
  }
  delete S.players[id];
  S.sync.mode="member"; S.sync.dirty=false; persist();
}

      addSession(sk,r.date,r.dist,r.mins,r.note,r.effort);
      var afterP=progress(sk,"d"), tg=sk.sides[0].target;
      if(tg>0&&beforeP<tg&&afterP>=tg){ toast("Goal reached: "+fmt(tg)+" "+sk.unit+periodLabel(sk.period)+"!"); buzz([60,40,60,40,120]); }
      else { toast("Saved "+fmt(r.dist)+" "+sk.unit+(r.mins>0?" · "+paceStr(sk,r.dist,r.mins):"")); buzz([30,30,30]); }
      if(view.name==="day") view.open=null;
      render(); break;
    case "sedit": go({name:"editsess",skill:el.dataset.skill,sid:el.dataset.id,ret:view}); break;
    case "scancel": go(view.ret||{name:"skill",id:view.skill}); break;
    case "savesess":
      var sbox=el.closest(".sform"); sk=byId(sbox.dataset.skill);
      var sr=readSession(sbox);
      if(!(sr.dist>0)){toast("Add the distance");break;}
      if(!validDate(sr.date)||sr.date>today()){toast("Choose a date up to today");break;}
      updateSession(sk,sbox.dataset.sid,sr.date,sr.dist,sr.mins,sr.note,sr.effort);
      var back=view.ret||{name:"skill",id:sk.id};
      go(back); toast("Session updated");
      break;
    case "dsess":
      if(sessArmed!==el.dataset.id){
        sessArmed=el.dataset.id; el.textContent="Tap again";
        var sid=el.dataset.id;
        setTimeout(function(){sessArmed=null;var b=document.querySelector('[data-act="dsess"][data-id="'+sid+'"]');if(b)b.textContent="Delete";},4000);
      } else { removeSession(byId(el.dataset.skill),el.dataset.id); sessArmed=null; render(); toast("Session deleted"); }
      break;

    case "statf": statFilter=el.dataset.v; renderStats(); break;
    case "range": statRange=parseInt(el.dataset.v,10); renderStats(); break;
  }
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el&&el.dataset&&el.dataset.k==="event"&&view.name==="addgame"){ readGameForm(); renderAddGame(); return; }
  if(el&&el.id==="shName"&&view.name==="share"){ S.me.name=el.value.trim().slice(0,30); save(); makeCode(); return; }
  if(el&&el.dataset&&el.dataset.act==="dset"&&view.name==="day"){
    var sk=byId(el.dataset.skill); if(!sk) return;
    setDay(sk,view.date,el.dataset.side,Math.max(0,parseInt(el.value,10)||0));
    refreshDay();
  }
});

document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden"){ if(syncMember()&&S.sync.dirty) syncFlush(true); }
  else if(syncOn()&&view.name==="team") syncPull();
});
setInterval(function(){ if(syncOn()&&view.name==="team"&&document.visibilityState==="visible") syncPull(); },60000);

if(!Array.isArray(S.badges)){ S.badges=badgeList(S.skills,S.games).filter(function(b){return b.earned;}).map(function(b){return b.id;}); persist(); }
render();
if(syncOn()){ if(syncMember()&&S.sync.dirty) syncFlush(); syncPull(); }
})();

</script>
</body>
</html>
